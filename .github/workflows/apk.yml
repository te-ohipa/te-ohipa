# Construit l'APK Android de Te ʻOhipa et le publie dans une Release.
# Lancement : onglet Actions → « Construire l'APK » → Run workflow.
# Il se relance aussi tout seul quand le dossier android/ change.
name: Construire l'APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Préparer la version et l'adresse
        run: |
          V=$(sed -E 's/.*"v" *: *"([^"]+)".*/\1/' version.json)
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "V=$V" >> $GITHUB_ENV
          echo "URL=https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_ENV
      - name: Clé de signature personnelle (facultatif)
        env: { KS_B64: '${{ secrets.KEYSTORE_B64 }}' }
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KS_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          echo "KS_PASS=${{ secrets.KEYSTORE_PASS }}" >> $GITHUB_ENV
          echo "KS_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> $GITHUB_ENV
      - name: Construire
        run: gradle -p android assembleRelease -PappUrl="$URL" -PvName="$V" -PvCode="$(date -u +%y%j%H%M)"
      - name: Publier la Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk te-ohipa.apk
          gh release create "v$V-${{ github.run_number }}" te-ohipa.apk --title "Te ʻOhipa $V" --notes "APK Android. Adresse chargée : $URL" --latest
      - uses: actions/upload-artifact@v4
        with: { name: te-ohipa.apk, path: te-ohipa.apk }

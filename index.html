fluide (fuite), condensats bouchés, télécommande, alimentation.</li><li>Le <b>fluide</b> se manipule uniquement par une personne habilitée ; on ne le relâche jamais dans l'air.</li><li>Conseil d'économie : 25 à 26 °C suffisent, portes et fenêtres fermées.</li></ul>"], ["Le solaire photovoltaïque", "<ul><li>Les <b>panneaux</b> produisent du courant continu à partir de la lumière du soleil.</li><li>L'<b>onduleur</b> transforme le courant continu en courant alternatif utilisable dans la maison.</li><li>Les <b>batteries</b> stockent l'énergie (sites isolés des îles, secours).</li><li>Puissance d'un panneau en watts-crête (Wc) ; production qui dépend de l'ensoleillement et de l'orientation.</li><li>Entretien : nettoyer les panneaux (sel, poussière), vérifier les connexions et l'onduleur.</li><li>Le fenua développe les énergies renouvelables : un métier d'avenir.</li></ul>"]], "q": [["Première étape d'un dépannage ?", ["écouter le client", "changer les pièces au hasard", "facturer", "repartir"], "Puis observer."], ["Avant de mesurer ou réparer, on…", ["met en sécurité par la consignation", "touche les fils", "appelle le client", "ouvre le compteur"], "Sécurité d'abord."], ["Le voltmètre se branche…", ["en parallèle, aux bornes", "en série", "hors tension uniquement", "sur la terre seulement"], "Mesure de tension."], ["La pince ampèremétrique se place…", ["autour d'un seul fil", "autour du câble entier", "sur la prise", "sur la terre"], "Sinon la mesure est nulle."], ["Le test de continuité se fait…", ["hors tension", "sous tension", "avec les mains mouillées", "sans appareil"], "Protège l'appareil et toi."], ["Réparer la cause, pas l'effet, c'est par exemple…", ["trouver pourquoi le disjoncteur saute", "réarmer sans arrêt", "mettre un disjoncteur plus gros", "débrancher tout"], "Sinon la panne revient."], ["L'unité extérieure d'une clim…", ["rejette la chaleur dehors", "produit le froid dehors", "ne sert à rien", "filtre l'air de la chambre"], "Le fluide transporte la chaleur."], ["Panne de clim fréquente et simple ?", ["filtres encrassés", "le fluide qui s'use tout seul chaque jour", "la couleur du mur", "le Wi-Fi"], "Nettoyer souvent."], ["Le fluide frigorigène est manipulé…", ["par une personne habilitée", "par tout le monde", "par le client", "jamais"], "On ne le relâche pas dans l'air."], ["L'onduleur sert à…", ["transformer le continu des panneaux en alternatif", "stocker l'énergie", "nettoyer les panneaux", "mesurer la pluie"], "Les batteries stockent."], ["La puissance d'un panneau solaire s'exprime en…", ["watts-crête (Wc)", "litres", "degrés", "ampères-heure seulement"], "Production maximale théorique."], ["Au bord de mer, les panneaux se nettoient à cause…", ["du sel et de la poussière", "des requins", "de la lune", "rien"], "La production baisse sinon."]], "c": [{"t": "Le disjoncteur qui saute la nuit", "s": "Chez un client, le différentiel saute chaque nuit vers 2 h du matin.", "o": [["Tu écoutes (quels appareils tournent la nuit ?), isoles les circuits un par un, mesures l'isolement et trouves l'appareil en défaut (souvent chauffe-eau ou clim).", 2, "Méthode : la cause est trouvée."], ["Tu remplaces le différentiel.", 1, "Possible, mais sans diagnostic."], ["Tu supprimes le différentiel.", 0, "Danger mortel."], ["Tu dis de couper la nuit.", 0, "Problème non réglé."]]}, {"t": "La clim qui coule", "s": "Dans un bungalow, de l'eau goutte de l'unité intérieure sur le lit.", "o": [["Tu coupes la clim, vérifies et débouches l'évacuation des condensats, nettoies les filtres et notes l'intervention.", 2, "Panne fréquente traitée."], ["Tu mets une serviette.", 0, "Problème non réglé."], ["Tu ajoutes du fluide.", 0, "Ce n'est pas la cause, et réservé aux habilités."], ["Tu changes la clim.", 1, "Coûteux sans diagnostic."]]}], "o": [["MAI", "Présentez votre méthode de dépannage.", ["Écouter", "Observer", "Sécuriser", "Mesurer", "Réparer et vérifier"]], ["FRO", "Comment fonctionne et s'entretient une climatisation ?", ["Principe d function atelier(n,done,back){const A=AT[n],D=dif(),tmax=D===2?60:D===1?120:0;let i=0,pts=0;AUSRC=null;
  const fmtn=v=>String(v).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g," ");
  (function show(){halt();const Q=A.it[i];window.scrollTo(0,0);
    app.innerHTML=hdr(`Atelier · ${i+1}/${A.it.length}`)+`<div class="card"><span class="tag">${A.t}</span><p class="q">${Q.q}</p>${tmax?`<div class="timer" id="tmr" style="font-size:22px"></div>`:""}<div id="zone"></div><div id="fb"></div></div>`;
    bindBack(back);const z=document.getElementById("zone"),fb=document.getElementById("fb");
    const fin=(sc,msg)=>{halt();pts+=sc;z.querySelectorAll("button,input").forEach(x=>x.disabled=true);
      fb.innerHTML=`<div class="fb" style="border-color:${sc===1?"var(--ok)":sc>0?"var(--gold)":"var(--ko)"}"><b>${msg}</b> ${Q.x}</div><button class="btn" id="nx">${i<A.it.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<A.it.length?show():done(Math.round(pts/A.it.length*100))}};
    if(typeof XK!=="undefined"&&XK[Q.k]){XK[Q.k](Q,z,fin);return}
    if(Q.k==="num"){z.innerHTML=`<div class="row"><input id="ans" type="text" inputmode="decimal" placeholder="Ta réponse" style="flex:2;padding:13px;border-radius:11px;border:1.5px solid var(--line);font:inherit;background:var(--bg);color:var(--ink)"><span style="flex:0 0 auto;font-weight:700">${Q.u}</span></div><button class="btn" id="val">Valider</button>`;
      const check=()=>{const raw=document.getElementById("ans").value.replace(/\s/g,"").replace(",",".");const v=parseFloat(raw);if(isNaN(v))return toast("Entre un nombre.");const ok=Math.abs(v-Q.a)<=Q.tol+1e-9;fin(ok?1:0,ok?"Exact.":`La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`)};
      document.getElementById("val").onclick=check;document.getElementById("ans").onkeydown=e=>{if(e.key==="Enter")check()};
      if(tmax)count(tmax,document.getElementById("tmr"),()=>fin(0,`Temps écoulé. La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`))}
    else{const pool=shuf(Q.it.map((t,k)=>[t,k]));let pick=[];
      const draw=()=>{z.innerHTML=`<p class="mut">Touche les étapes dans l'ordre. Touche une étape déjà placée pour l'enlever.</p><div id="chosen">${pick.map((p,n)=>`<button class="opt" data-p="${n}" style="border-color:var(--lag)"><b>${n+1}.</b> ${p[0]}</button>`).join("")}</div>${pick.length<pool.length?`<p class="mut" style="margin-top:10px">À placer :</p>`:""}<div>${pool.filter(p=>!pick.includes(p)).map(p=>`<button class="opt" data-k="${p[1]}">${p[0]}</button>`).join("")}</div>${pick.length===pool.length?`<button class="btn" id="val">Valider l'ordre</button>`:""}`;
        z.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pick.push(pool.find(p=>p[1]===+b.dataset.k));draw()});
        z.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.p,1);draw()});
        const v=document.getElementById("val");if(v)v.onclick=()=>{const good=pick.filter((p,n)=>p[1]===n).length,sc=good/pool.length;
          z.innerHTML=`<p class="mut">Ordre correct :</p>`+Q.it.map((t,n)=>`<div class="opt ${pick[n][1]===n?"good":"bad"}"><b>${n+1}.</b> ${t}</div>`).join("");fin(sc===1?1:Math.round(sc*100)/100,sc===1?"Exact.":`${good} étape(s) bien placée(s) sur ${pool.length}.`)}};
      draw();if(tmax)count(tmax*1.5,document.getElementById("tmr"),()=>{z.innerHTML=Q.it.map((t,n)=>`<div class="opt"><b>${n+1}.</b> ${t}</div>`).join("");fin(0,"Temps écoulé.")})}})()}

const NS=L.length*5,KEY="ohipa-ele-v1",DAYN=["J1","J2","J3","J4","J5"];
let S={s:{},xp:0,w:[],days:[],free:false,txt:{},ex:[]},tm=null;

function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rng=(a,b)=>Array.from({length:b-a},(_,i)=>a+i);
const today=()=>new Date().toISOString().slice(0,10);
function mix(n,l){ // révision : erreurs d'abord, puis tirage dans les niveaux déjà vus
  const pool=[];for(let i=0;i<=l;i++)L[i].q.forEach((_,k)=>pool.push(i+"."+k));
  const w=shuf(S.w.filter(k=>pool.includes(k))),rest=shuf(pool.filter(k=>!w.includes(k)));
  return w.concat(rest).slice(0,n).map(k=>k.split(".").map(Number));}
function plan(l,d){const Q=a=>a.map(k=>[l,k]),m=SIMMAP[l],sn=m==="dil"?"Dilemme du métier":"Atelier : "+AT[+m.slice(2)].t;
  return [
  [{k:"lire",f:[0],m:4},{k:"quiz",q:()=>Q(rng(0,6)),m:5},{k:"cas",c:[0],m:4}],
  [{k:"lire",f:[1],m:4},{k:"quiz",q:()=>Q(rng(6,12)),m:5},{k:"sim",m:6,n:sn}],
  [{k:"lire",f:[2],m:4},{k:"cas",c:[1],m:4},{k:"quiz",q:()=>mix(6,l),m:4,n:"Révision"}],
  [{k:"lire",f:[3],m:4},{k:"oral",o:[0],m:5},{k:"quiz",q:()=>mix(6,l),m:4,n:"Révision ciblée"}],
  [{k:"oral",o:[1],m:5},{k:"quiz",q:()=>shuf(Q(rng(0,12))),m:8,n:"Défi du niveau"}]][d];}
const LBL={sim:["🧩","Simulation"],lire:["📖","Fiches à lire"],quiz:["✅","Quiz"],cas:["🧭","Mise en situation"],oral:["🎙️","Face au recruteur"],ecrit:["✍️","Cas écrit"]};
const sk=(l,d,i)=>l+"."+d+"."+i;
const dayDone=(l,d)=>plan(l,d).every((_,i)=>sk(l,d,i) in S.s);
function curDay(){for(let n=0;n<NS;n++){const l=Math.floor(n/5),d=n%5;if(!dayDone(l,d))return n}return NS}
function streak(){let n=0,dt=new Date();const has=x=>S.days.includes(x.toISOString().slice(0,10));
  if(!has(dt))dt.setDate(dt.getDate()-1);while(has(dt)){n++;dt.setDate(dt.getDate()-1)}return n}
const RANKS=[[0, "Débutant"], [150, "Aide"], [400, "Agent de maintenance"], [800, "Électricien"], [1300, "Électricien confirmé"], [1900, "Chef d'équipe"], [2600, "Technicien référent"]];
function rank(){let r=RANKS[0],nx=null;for(const x of RANKS){if(S.xp>=x[0])r=x;else{nx=x;break}}return{r,nx}}
function gain(key,score){const first=!(key in S.s);const xp=first?10+Math.round(score/5):5;
  if(key)S.s[key]=Math.max(S.s[key]||0,score);S.xp+=xp;if(!S.days.includes(today()))S.days.push(today());save();return xp}
const TTS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
let AU=null,AUSRC=null,AUBLOB={};
function hush(){try{if(TTS)speechSynthesis.cancel()}catch(e){}try{if(AU){AU.pause();AU=null}}catch(e){}}
function prefetch(src){AUSRC=src;if(!src||AUBLOB[src])return;try{fetch(src).then(r=>r.ok?r.blob():null).then(b=>{if(b)AUBLOB[src]=URL.createObjectURL(b)}).catch(()=>{})}catch(e){}}
function toast(t){let d=document.getElementById("tst");if(!d){d=document.createElement("div");d.id="tst";d.style.cssText="position:fixed;left:12px;right:12px;bottom:80px;background:#14323a;color:#fff;padding:12px 14px;border-radius:12px;font-size:14.5px;z-index:9";document.body.appendChild(d)}d.textContent=t;d.style.display="block";clearTimeout(d._t);d._t=setTimeout(()=>d.style.display="none",6000)}
function playFile(btn){const src=AUBLOB[AUSRC]||AUSRC;try{const a=new Audio(src);AU=a;a.onended=a.onerror=()=>{if(AU===a){AU=null;btn.textContent="🔊 Écouter"}};const pr=a.play();btn.textContent="⏹ Arrêter";if(pr&&pr.catch)pr.catch(()=>{AU=null;btn.textContent="🔊 Écouter";toast("Lecture impossible ici. Ouvre le jeu dans Chrome pour l'écouter.")})}catch(e){toast("Lecture impossible ici.")}}
function halt(){if(tm){clearInterval(tm);tm=null}hush()}
function readOut(btn){
  if(AU||(TTS&&speechSynthesis.speaking)){hush();btn.textContent="🔊 Écouter";return}
  if(!TTS)return toast("La lecture audio utilise la voix du téléphone : ouvre le jeu dans Chrome ou installe l'application (Profil).")
  try{
  const box=document.createElement("div");app.querySelectorAll(".card").forEach(c=>box.appendChild(c.cloneNode(true)));
  box.querySelectorAll("textarea,.timer,.btn,.tag,.av,input").forEach(x=>x.remove());
  box.querySelectorAll("li,p,h2,h3,.opt,.fb,label,b").forEach(x=>x.append(". "));
  const txt=box.textContent.replace(/[✓✗≈«»]/g," ").replace(/\s+/g," ").trim();if(!txt)return;
  const parts=txt.match(/[^.!?]+[.!?]*/g)||[txt];let n=0;
  parts.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;
    u.onend=u.onerror=()=>{if(++n>=parts.length)btn.textContent="🔊 Écouter"};speechSynthesis.speak(u)});
  btn.textContent="⏹ Arrêter"}catch(e){}}
function hdr(title,back){return `<div class="top"><button class="back" id="bk">←</button><b>${title}</b><button class="au" id="au">🔊 Écouter</button></div>`}

  const g=document.getElementById("goDay");if(g)g.onclick=()=>go("day",l,d);

function quiz(items,title,done,back){AUSRC=null;let i=0,ok=0;if(!items.length)return done(100);(function show(){const [l,k]=items[i],Q=L[l].q[k],o=shuf(Q[1].map((t,j)=>[t,j===0]));hush();window.scrollTo(0,0);

  bindBack(back);const bs=app.querySelectorAll(".opt");
    if(dif()>0){const tb=document.createElement("div");tb.className="timer";tb.style.fontSize="22px";app.querySelector(".card").prepend(tb);count(dif()===2?25:45,tb,()=>{const k2=l+"."+k;if(!S.w.includes(k2))S.w.push(k2);save();bs.forEach((x,m)=>{x.disabled=true;if(o[m][1])x.classList.add("good")});document.getElementById("fb").innerHTML=`<div class="fb"><b>Temps écoulé.</b> ${Q[2]}</div><button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;document.getElementById("nx").onclick=()=>{i++;i<items.length?show():done(Math.round(ok/items.length*100))}})}
    bs.forEach((b,j)=>b.onclick=()=>{halt();const good=o[j][1],key=l+"."+k;bs.forEach((x,m)=>{x.disabled=true;if(o[m][1])x.classList.add("good")});

    document.getElementById("nx").onclick=()=>{i++;i<items.length?show():done(Math.round(ok/items.length*100))}})})()}
function cas(l,cs,done,back){AUSRC=null;let i=0,pts=0;(function show(){const C=L[l].c[cs[i]],o=shuf(C.o);hush();window.scrollTo(0,0);
  app.innerHTML=hdr(`Situation ${i+1}/${cs.length}`)+`<div class="card"><h2 style="margin-top:0">${C.t}</h2><p>${C.s}</p><p class="mut">Que fais-tu ?</p>${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0]}</button>`).join("")}<div id="fb"></div></div>`;
  bindBack(back);const bs=app.querySelectorAll(".opt");bs.forEach((b,j)=>b.onclick=()=>{pts+=o[j][1];bs.forEach((x,m)=>{x.disabled=true;{const c=o[m][1]===2?"good":o[m][1]===0?"bad":"";if(c)x.classList.add(c)};x.innerHTML+=`<br><small>${["✗","≈","✓"][o[m][1]]} ${o[m][2]}</small>`});b.style.outline="3px solid var(--gold)";
    document.getElementById("fb").innerHTML=`<button class="btn" id="nx">${i<cs.length-1?"Situation suivante":"Terminer"}</button>`;
    document.getElementById("nx").onclick=()=>{i++;i<cs.length?show():done(Math.round(pts/(cs.length*2)*100))}})})()}
function timerBox(sec){return `<div class="timer" id="tmr">${fmt(sec)}</div><div class="row"><button class="btn sec" id="tgo" style="margin:0">Démarrer le chrono</button></div>`}
const fmt=s=>(s>=3600?Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0"):Math.floor(s/60))+":"+String(s%60).padStart(2,"0");
function bindTimer(sec){let left=sec;const el=document.getElementById("tmr"),b=document.getElementById("tgo");b.onclick=()=>{if(tm){halt();b.textContent="Reprendre";return}b.textContent="Pause";tm=setInterval(()=>{left--;el.textContent=fmt(Math.max(0,left));if(left<=0){halt();el.textContent="Temps écoulé";b.disabled=true}},1000)}}
function oral(list,done,back){AUSRC=null;let i=0,tot=0;(function show(){const [l,k]=list[i],O=L[l].o[k],j=J[O[0]];halt();window.scrollTo(0,0);

function examOral(o){AUSRC=null;const back=()=>go("exam"),asked=[];
  app.innerHTML=hdr(o.t)+`<div class="card fiche"><h2 style="margin-top:0">Déroulement</h2><ul><li><b>${o.expo} minutes</b> d'exposé : ton parcours et ton projet. À la fin du temps, le recruteur te coupe.</li><li>Puis des questions jusqu'à <b>${o.total} minutes</b> au total, sans préparation, avec des relances.</li><li>Réponds <b>à voix haute</b>. Tu ne verras les attendus qu'au débriefing.</li><li>Aucune pause. Quitter l'écran annule l'épreuve.</li></ul><label class="ck" style="border:0"><input type="checkbox" id="vx" ${TTS?"checked":"disabled"}><span>Le recruteur pose ses questions à voix haute${TTS?"":" (indisponible sur cet appareil)"}</span></label><button class="btn" id="st">Entrer dans la salle</button></div>`;
  bindBack(back);document.getElementById("st").onclick=()=>p1(document.getElementById("vx").checked);
  function p1(voice){const line=`Bonjour. Installez-vous. Vous avez ${o.expo} minutes pour vous présenter, nous vous écoutons.`,t0=Date.now();window.scrollTo(0,0);
    app.innerHTML=`<div class="card"><span class="tag">Exposé</span><p class="q">« ${line} »</p><div class="timer" id="tmr"></div><p class="mut">Regarde l'écran comme tu regarderais le recruteur. Ne lis pas tes notes.</p><button class="btn" id="nx">J'ai terminé mon exposé</button></div>`;
    if(voice)say(line);const nx=cut=>{clearInterval(tm);tm=null;p2(voice,cut,Math.round((Date.now()-t0)/1000))};
    count(o.expo*60,document.getElementById("tmr"),()=>nx(true));document.getElementById("nx").onclick=()=>nx(false)}
  function p2(voice,cut,used){const qs=shuf(o.pool()).slice(0,16);let i=-1,rel=false,over=false;window.scrollTo(0,0);
    const fin=()=>{if(over)return;over=true;clearInterval(tm);tm=null;hush();debrief(cut,used)};
    app.innerHTML=`<div class="card"><span class="tag">Entretien</span><div class="timer" id="tmr"></div><div id="qz"></div><button class="btn" id="nx">J'ai répondu : question suivante</button></div>`;
    count(Math.max(60,o.total*60-used),document.getElementById("tmr"),fin);
    const put=(q,txt,pre)=>{const j=J[q[0]];document.getElementById("qz").innerHTML=`<div class="jur"><div class="av" style="background:${j.c}">${j.n.split(" ").pop()[0]}</div><div><b>${j.n}</b><br><small>${j.r}</small></div></div><p class="q">« ${pre||""}${txt} »</p>`;if(voice)say((pre||"")+txt)};
    const nxt=()=>{if(!rel&&i>=0&&Math.random()<.35){rel=true;put(qs[i],RELANCES[Math.floor(Math.random()*RELANCES.length)])}else{rel=false;i++;if(i>=qs.length)return fin();asked.push(qs[i]);put(qs[i],qs[i][1],i===0&&cut?"Je vous interromps, le temps de l'exposé est écoulé. ":"")}};
    document.getElementById("nx").onclick=nxt;nxt()}
  function debrief(cut,used){const tgt=o.expo*60,msg=cut?"interrompu par le recruteur : exposé trop long ou mal minuté":used<tgt*.6?"nettement trop court : tu laisses du temps aux questions difficiles":"durée correcte";window.scrollTo(0,0);
    app.innerHTML=hdr("Débriefing")+`<div class="card"><p><b>Exposé : ${fmt(used)}</b> sur ${o.expo}:00, ${msg}.</p><p><b>${asked.length} questions</b> traitées. Ouvre chacune et compare avec ce que tu as réellement dit.</p></div>`+asked.map(q=>`<details class="card"><summary><b>${J[q[0]].n} :</b> ${q[1]}</summary><ul>${q[2].map(k=>`<li>${k}</li>`).join("")}</ul></details>`).join("")+`<div class="card"><h3>Grille du recruteur</h3><p class="mut">Note-toi comme un recruteur le ferait : 0 = absent, 2 = moyen, 4 = excellent.</p>${CRIT.map(c=>`<label class="ck"><span style="flex:1">${c}</span><select>${[0,1,2,3,4].map(n=>`<option ${n===2?"selected":""}>${n}</option>`).join("")}</select></label>`).join("")}<button class="btn" id="ok">Calculer ma note</button></div>`;
    bindBack(back);document.getElementById("ok").onclick=()=>{let n=0;app.querySelectorAll("select").forEach(x=>n+=+x.value);note20(o.t,n,back)}}}
function examQCM(){AUSRC=null;const back=()=>go("exam"),pool=[];L.forEach((x,l)=>x.q.forEach((_,k)=>pool.push([l,k])));const items=shuf(pool).slice(0,30),res=[];let i=0,over=false;
  app.innerHTML=hdr("QCM · 30 questions")+`<div class="timer" id="tmr"></div><div id="qz"></div>`;bindBack(back);
  const fin=()=>{if(over)return;over=true;clearInterval(tm);tm=null;const ok=res.filter(r=>r[2]).length,n=Math.round(ok/items.length*40)/2,ko=res.filter(r=>!r[2]);window.scrollTo(0,0);

    bindBack(back);ko.forEach(r=>{const k=r[0]+"."+r[1];if(!S.w.includes(k))S.w.push(k)});document.getElementById("ok").onclick=()=>note20("QCM",n,back)};

const DIFF=["Normal","Difficile","Expert"];
const dif=()=>S.diff||0;
function simu(done,back){const st=Object.assign({},SIMCFG.st),fl={},log=[],D=dif(),mult=D===2?1.5:D===1?1.25:1,tmax=D===2?40:D===1?75:0;let i=0;
  const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
  const bars=()=>D===2?`<p class="mut">Mode expert : indicateurs masqués jusqu'au bilan.</p>`:Object.keys(IND).map(k=>`<div style="display:flex;gap:8px;align-items:center;font-size:13px"><span style="flex:0 0 150px">${IND[k]}</span><div class="bar" style="flex:1;margin:3px 0"><i style="width:${st[k]}%;background:${st[k]<40?"var(--ko)":st[k]<60?"var(--gold)":"var(--ok)"}"></i></div></div>`).join("");
  app.innerHTML=hdr(SIMCFG.title)+`<div class="card fiche"><h2 style="margin-top:0">${SIMCFG.head}</h2><p>${SIMCFG.intro} <b>Chaque décision change la suite</b> : certaines situations n'arrivent que parce que tu as choisi quelque chose avant.</p><ul><li>Six indicateurs : ${Object.values(IND).join(", ").toLowerCase()}.</li><li>Niveau : <b>${DIFF[D]}</b>${tmax?` · ${tmax} secondes par décision, sinon la situation décide pour toi`:""}${D>=1?" · explications seulement au bilan":""}.</li><li>Change le niveau dans Profil.</li></ul><button class="btn" id="go">${SIMCFG.start}</button></div>`;
  bindBack(back);document.getElementById("go").onclick=next;
  function next(){halt();while(i<EV.length&&EV[i].when&&!EV[i].when(fl))i++;if(i>=EV.length)return bilan();const E=EV[i],o=shuf(E.o.map((x,k)=>[x,k]));window.scrollTo(0,0);
    app.innerHTML=hdr(E.j)+`<div class="card">${bars()}</div><div class="card"><h2 style="margin-top:0">${E.t}</h2><p>${E.s}</p>${tmax?`<div class="timer" id="tmr"></div>`:""}${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0][0]}</button>`).join("")}<div id="fb"></div></div>`;
    bindBack(back);
    const pick=j=>{halt();const opt=j<0?["Aucune décision prise à temps.",SIMCFG.none,[],"Ne pas décider est une décision : la situation s'est dégradée sans toi."]:o[j][0];
      Object.entries(opt[1]).forEach(([k,v])=>st[k]=clamp(st[k]+(v<0?v*mult:v)));opt[2].forEach(f=>fl[f]=1);
      const best=Math.max(...E.o.map(x=>Object.values(x[1]).reduce((s,v)=>s+v,0)));const mine=Object.values(opt[1]).reduce((s,v)=>s+v,0);
      log.push({j:E.j,t:E.t,c:opt[0],fb:opt[3],ok:mine>=best});i++;
      if(D===0){app.querySelectorAll(".opt").forEach(b=>b.disabled=true);if(j>=0)app.querySelectorAll(".opt")[j].classList.add(mine>=best?"good":"bad");document.getElementById("fb").innerHTML=`<div class="fb">${opt[3]}</div><button class="btn" id="nx">Continuer</button>`;document.getElementById("nx").onclick=next}else next()};
    app.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>pick(j));
    if(tmax)count(tmax,document.getElementById("tmr"),()=>pick(-1))}
  function bilan(){window.scrollTo(0,0);const w=SIMCFG.w,tot=Object.keys(w).reduce((s,k)=>s+st[k]*w[k],0)/Object.values(w).reduce((s,v)=>s+v,0);
    let sc=Math.round(tot);if(SIMCFG.crit.some(k=>st[k]<45)||SIMCFG.cap(fl))sc=Math.min(sc,45);
    const nb=log.filter(x=>x.ok).length,grade=SIMCFG.grades[sc>=85?0:sc>=70?1:sc>=55?2:3];
    const chains=CHAINS.filter(c=>c[0](fl)).map(c=>c[1]);
    app.innerHTML=hdr("Bilan du mois")+`<div class="card" style="text-align:center"><h2>${sc}/100</h2><p><b>${grade}</b> · ${nb} meilleures décisions sur ${log.length}</p></div><div class="card">${Object.keys(IND).map(k=>`<p style="display:flex;justify-content:space-between;margin:4px 0"><span>${IND[k]}</span><b style="color:${st[k]<40?"var(--ko)":st[k]<60?"var(--gold)":"var(--ok)"}">${st[k]}</b></p>`).join("")}</div>${chains.length?`<div class="card warn"><h3>L'effet domino</h3><ul class="mut" style="padding-left:18px">${chains.map(c=>`<li>${c}</li>`).join("")}</ul></div>`:""}<h2>Tes décisions</h2>${log.map(x=>`<details class="card"><summary>${x.ok?"✓":"✗"} <b>${x.j}</b> · ${x.t}</summary><p><b>Ton choix :</b> ${x.c}</p><div class="fb">${x.fb}</div></details>`).join("")}<button class="btn" id="ok">Terminer</button>`;
    bindBack(back);document.getElementById("ok").onclick=()=>{S.ex.unshift([today(),"Un mois aux RH · "+DIFF[D],Math.round(sc/5*10)/10]);S.ex=S.ex.slice(0,30);done(sc)}}}

  app.innerHTML=hdr("Ateliers et dilemmes")+`<p class="mut">Niveau actuel : <b>${DIFF[dif()]}</b> (à changer dans Profil).</p><h2>Ateliers pratiques</h2>`+AT.map((p,i)=>`<button class="step ${("at"+i) in S.s?"done":""}" data-i="${i}"><span class="ic">🧮</span><span><b>${p.t}</b><br><small>${p.lv} · ${p.it.length} exercices</small></span>${("at"+i) in S.s?`<span class="sc">${S.s["at"+i]}%</span>`:""}</button>`).join("")+`<h2>Dilemmes du technicien</h2><button class="step" id="dl"><span class="ic">⚖️</span><span><b>Problèmes, compromis, conséquences</b><br><small>${DIL.length} situations, avec leurs effets à long terme</small></span>${"dil" in S.s?`<span class="sc">${S.s.dil}%</span>`:""}</button>`;

  document.getElementById("dl").onclick=()=>dilem(sc=>end("dil",sc,simHub),simHub)}

function atelier(n,done,back){const A=AT[n],D=dif(),tmax=D===2?60:D===1?120:0;let i=0,pts=0;AUSRC=null;
  const fmtn=v=>String(v).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g," ");

    app.innerHTML=hdr(`Atelier · ${i+1}/${A.it.length}`)+`<div class="card"><span class="tag">${A.t}</span><p class="q">${Q.q}</p>${tmax?`<div class="timer" id="tmr" style="font-size:22px"></div>`:""}<div id="zone"></div><div id="fb"></div></div>`;
    bindBack(back);const z=document.getElementById("zone"),fb=document.getElementById("fb");
    const fin=(sc,msg)=>{halt();pts+=sc;z.querySelectorAll("button,input").forEach(x=>x.disabled=true);
      fb.innerHTML=`<div class="fb" style="border-color:${sc===1?"var(--ok)":sc>0?"var(--gold)":"var(--ko)"}"><b>${msg}</b> ${Q.x}</div><button class="btn" id="nx">${i<A.it.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<A.it.length?show():done(Math.round(pts/A.it.length*100))}};
    if(typeof XK!=="undefined"&&XK[Q.k]){XK[Q.k](Q,z,fin);return}
    if(Q.k==="num"){z.innerHTML=`<div class="row"><input id="ans" type="text" inputmode="decimal" placeholder="Ta réponse" style="flex:2;padding:13px;border-radius:11px;border:1.5px solid var(--line);font:inherit;background:var(--bg);color:var(--ink)"><span style="flex:0 0 auto;font-weight:700">${Q.u}</span></div><button class="btn" id="val">Valider</button>`;
      const check=()=>{const raw=document.getElementById("ans").value.replace(/\s/g,"").replace(",",".");const v=parseFloat(raw);if(isNaN(v))return toast("Entre un nombre.");const ok=Math.abs(v-Q.a)<=Q.tol+1e-9;fin(ok?1:0,ok?"Exact.":`La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`)};
      document.getElementById("val").onclick=check;document.getElementById("ans").onkeydown=e=>{if(e.key==="Enter")check()};
      if(tmax)count(tmax,document.getElementById("tmr"),()=>fin(0,`Temps écoulé. La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`))}
    else{const pool=shuf(Q.it.map((t,k)=>[t,k]));let pick=[];

        z.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pick.push(pool.find(p=>p[1]===+b.dataset.k));draw()});
        z.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.p,1);draw()});
        const v=document.getElementById("val");if(v)v.onclick=()=>{const good=pick.filter((p,n)=>p[1]===n).length,sc=good/pool.length;
          z.innerHTML=`<p class="mut">Ordre correct :</p>`+Q.it.map((t,n)=>`<div class="opt ${pick[n][1]===n?"good":"bad"}"><b>${n+1}.</b> ${t}</div>`).join("");fin(sc===1?1:Math.round(sc*100)/100,sc===1?"Exact.":`${good} étape(s) bien placée(s) sur ${pool.length}.`)}};
      draw();if(tmax)count(tmax*1.5,document.getElementById("tmr"),()=>{z.innerHTML=Q.it.map((t,n)=>`<div class="opt"><b>${n+1}.</b> ${t}</div>`).join("");fin(0,"Temps écoulé.")})}})()}

function hush(){try{if(TTS)speechSynthesis.cancel()}catch(e){}try{if(AU){AU.pause();AU=null}}catch(e){}}
function prefetch(src){AUSRC=src;if(!src||AUBLOB[src])return;try{fetch(src).then(r=>r.ok?r.blob():null).then(b=>{if(b)AUBLOB[src]=URL.createObjectURL(b)}).catch(()=>{})}catch(e){}}
function toast(t){let d=document.getElementById("tst");if(!d){d=document.createElement("div");d.id="tst";d.style.cssText="position:fixed;left:12px;right:12px;bottom:80px;background:#14323a;color:#fff;padding:12px 14px;border-radius:12px;font-size:14.5px;z-index:9";document.body.appendChild(d)}d.textContent=t;d.style.display="block";clearTimeout(d._t);d._t=setTimeout(()=>d.style.display="none",6000)}
function playFile(btn){const src=AUBLOB[AUSRC]||AUSRC;try{const a=new Audio(src);AU=a;a.onended=a.onerror=()=>{if(AU===a){AU=null;btn.textContent="🔊 Écouter"}};const pr=a.play();btn.textContent="⏹ Arrêter";if(pr&&pr.catch)pr.catch(()=>{AU=null;btn.textContent="🔊 Écouter";toast("Lecture impossible ici. Ouvre le jeu dans Chrome pour l'écouter.")})}catch(e){toast("Lecture impossible ici.")}}
function halt(){if(tm){clearInterval(tm);tm=null}hush()}
function readOut(btn){
  if(AU||(TTS&&speechSynthesis.speaking)){hush();btn.textContent="🔊 Écouter";return}
  if(!TTS)return toast("La lecture audio utilise la voix du téléphone : ouvre le jeu dans Chrome ou installe l'application (Profil).")
  try{
  const box=document.createElement("div");app.querySelectorAll(".card").forEach(c=>box.appendChild(c.cloneNode(true)));
  box.querySelectorAll("textarea,.timer,.btn,.tag,.av,input").forEach(x=>x.remove());
  box.querySelectorAll("li,p,h2,h3,.opt,.fb,label,b").forEach(x=>x.append(". "));
  const txt=box.textContent.replace(/[✓✗≈«»]/g," ").replace(/\s+/g," ").trim();if(!txt)return;
  const parts=txt.match(/[^.!?]+[.!?]*/g)||[txt];let n=0;
  parts.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;
    u.onend=u.onerror=()=>{if(++n>=parts.length)btn.textContent="🔊 Écouter"};speechSynthesis.speak(u)});
  btn.textContent="⏹ Arrêter"}catch(e){}}
function hdr(title,back){return `<div class="top"><button class="back" id="bk">←</button><b>${title}</b><button class="au" id="au">🔊 Écouter</button></div>`}
function bindBack(fn){const b=document.getElementById("bk");if(b)b.onclick=()=>{halt();fn()};const a=document.getElementById("au");if(a)a.onclick=()=>readOut(a)}
function setNav(v){const it=[["home","🏝️","Accueil"],["parcours","🗺️","Parcours"],["fiches","📚","Fiches"],["exam","⏱️","Entretien"],["profil","👤","Profil"]];
  nav.innerHTML=it.map(x=>`<button class="${x[0]===v?"on":""}" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(v,a,b){halt();AUSRC=null;window.scrollTo(0,0);setNav(v);({home,parcours,fiches,conseil,profil,day,exam})[v](a,b);try{if(v!=="day")location.hash=v}catch(e){}}

function quiz(items,title,done,back){AUSRC=null;let i=0,ok=0;if(!items.length)return done(100);(function show(){const [l,k]=items[i],Q=L[l].q[k],o=shuf(Q[1].map((t,j)=>[t,j===0]));hush();window.scrollTo(0,0);

  bindBack(back);const bs=app.querySelectorAll(".opt");
    if(dif()>0){const tb=document.createElement("div");tb.className="timer";tb.style.fontSize="22px";app.querySelector(".card").prepend(tb);count(dif()===2?25:45,tb,()=>{const k2=l+"."+k;if(!S.w.includes(k2))S.w.push(k2);save();bs.forEach((x,m)=>{x.disabled=true;if(o[m][1])x.classList.add("good")});document.getElementById("fb").innerHTML=`<div class="fb"><b>Temps écoulé.</b> ${Q[2]}</div><button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;document.getElementById("nx").onclick=()=>{i++;i<items.length?show():done(Math.round(ok/items.length*100))}})}

function cas(l,cs,done,back){AUSRC=null;let i=0,pts=0;(function show(){const C=L[l].c[cs[i]],o=shuf(C.o);hush();window.scrollTo(0,0);

function timerBox(sec){return `<div class="timer" id="tmr">${fmt(sec)}</div><div class="row"><button class="btn sec" id="tgo" style="margin:0">Démarrer le chrono</button></div>`}
const fmt=s=>(s>=3600?Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0"):Math.floor(s/60))+":"+String(s%60).padStart(2,"0");
function bindTimer(sec){let left=sec;const el=document.getElementById("tmr"),b=document.getElementById("tgo");b.onclick=()=>{if(tm){halt();b.textContent="Reprendre";return}b.textContent="Pause";tm=setInterval(()=>{left--;el.textContent=fmt(Math.max(0,left));if(left<=0){halt();el.textContent="Temps écoulé";b.disabled=true}},1000)}}
function oral(list,done,back){AUSRC=null;let i=0,tot=0;(function show(){const [l,k]=list[i],O=L[l].o[k],j=J[O[0]];halt();window.scrollTo(0,0);

function examOral(o){AUSRC=null;const back=()=>go("exam"),asked=[];
  app.innerHTML=hdr(o.t)+`<div class="card fiche"><h2 style="margin-top:0">Déroulement</h2><ul><li><b>${o.expo} minutes</b> d'exposé : ton parcours et ton projet. À la fin du temps, le recruteur te coupe.</li><li>Puis des questions jusqu'à <b>${o.total} minutes</b> au total, sans préparation, avec des relances.</li><li>Réponds <b>à voix haute</b>. Tu ne verras les attendus qu'au débriefing.</li><li>Aucune pause. Quitter l'écran annule l'épreuve.</li></ul><label class="ck" style="border:0"><input type="checkbox" id="vx" ${TTS?"checked":"disabled"}><span>Le recruteur pose ses questions à voix haute${TTS?"":" (indisponible sur cet appareil)"}</span></label><button class="btn" id="st">Entrer dans la salle</button></div>`;
  bindBack(back);document.getElementById("st").onclick=()=>p1(document.getElementById("vx").checked);
  function p1(voice){const line=`Bonjour. Installez-vous. Vous avez ${o.expo} minutes pour vous présenter, nous vous écoutons.`,t0=Date.now();window.scrollTo(0,0);
    app.innerHTML=`<div class="card"><span class="tag">Exposé</span><p class="q">« ${line} »</p><div class="timer" id="tmr"></div><p class="mut">Regarde l'écran comme tu regarderais le recruteur. Ne lis pas tes notes.</p><button class="btn" id="nx">J'ai terminé mon exposé</button></div>`;
    if(voice)say(line);const nx=cut=>{clearInterval(tm);tm=null;p2(voice,cut,Math.round((Date.now()-t0)/1000))};
    count(o.expo*60,document.getElementById("tmr"),()=>nx(true));document.getElementById("nx").onclick=()=>nx(false)}
  function p2(voice,cut,used){const qs=shuf(o.pool()).slice(0,16);let i=-1,rel=false,over=false;window.scrollTo(0,0);
    const fin=()=>{if(over)return;over=true;clearInterval(tm);tm=null;hush();debrief(cut,used)};
    app.innerHTML=`<div class="card"><span class="tag">Entretien</span><div class="timer" id="tmr"></div><div id="qz"></div><button class="btn" id="nx">J'ai répondu : question suivante</button></div>`;

const L=[{"t": "Accueillir, écrire, organiser", "s": "Téléphone, courrier, compte rendu, agenda, classement.", "f": [["Les métiers du secrétariat", "<ul><li><b>Secrétaire</b>, <b>assistant administratif</b> : courrier, téléphone, agenda, classement, saisie.</li><li><b>Agent d'accueil</b> : reçoit, oriente, renseigne le public.</li><li><b>Assistant de direction</b> : organise le travail d'un responsable, prépare réunions et dossiers.</li><li><b>Secrétaire médicale</b>, <b>juridique</b>, <b>comptable</b> : spécialisations recherchées.</li><li>Présent dans toutes les entreprises, les administrations, les cabinets médicaux.</li><li>Qualités : organisation, discrétion, bonne orthographe, sens du contact, maîtrise de Word, d'Excel et de la messagerie.</li></ul>"], ["L'accueil et le téléphone", "<ul><li>Décrocher vite : « <b>[Entreprise], [prénom], bonjour</b>, que puis-je pour vous ? » ; « Ia ora na » est bienvenu au fenua.</li><li>Écouter, reformuler, ne jamais laisser attendre sans explication.</li><li><b>Message complet</b> : nom, société, numéro, objet, date et heure, urgence, qui a pris le message.</li><li>Filtrer avec tact : « Il est en réunion, puis-je prendre un message ? »</li><li>Appelant mécontent : écouter, rester courtois, ne pas promettre ce qu'on ne peut pas tenir, transmettre.</li><li>Discrétion : on ne donne pas d'informations personnelles ou confidentielles au téléphone.</li></ul>"], ["Le courrier et le courriel", "<ul><li><b>Lettre</b> : coordonnées de l'expéditeur, du destinataire, lieu et date, <b>objet</b>, formule d'appel (« Madame, »), corps (une idée par paragraphe), formule de politesse, signature.</li><li>Formule de fin courante : « Veuillez agréer, Madame, l'expression de mes salutations distinguées. »</li><li><b>Courriel</b> : objet précis, message court, une demande claire, pièce jointe vérifiée, signature complète.</li><li>Relire : orthographe, noms propres, dates, montants.</li><li><b>Compte rendu</b> : date, lieu, présents et excusés, ordre du jour, résumé, <b>décisions</b>, <b>qui fait quoi et pour quand</b> ; diffusé vite.</li></ul>"], ["Agenda et classement", "<ul><li><b>Agenda</b> : noter tous les rendez-vous, prévoir des marges, confirmer la veille, préparer les documents.</li><li>Priorités : urgent et important d'abord (matrice d'Eisenhower).</li><li><b>Classement</b> : par thème, puis par date ; noms de fichiers clairs (date_objet), dossiers partagés bien rangés.</li><li>Archivage : garder les documents le temps exigé, détruire de façon sûre ce qui est confidentiel.</li><li>Données personnelles : ne garder que le nécessaire, protéger l'accès.</li><li>Outils : traitement de texte, tableur, messagerie, agenda partagé.</li></ul>"]], "q": [["La première phrase au téléphone comprend…", ["le nom de l'entreprise, ton prénom et bonjour", "« Allô ? » seulement", "ton numéro personnel", "rien, on attend"], "Puis « que puis-je pour vous ? »."], ["Un message téléphonique complet contient…", ["nom, numéro, objet, date, heure et urgence", "seulement le prénom", "la météo", "ton avis"], "Et qui l'a pris."], ["Le responsable est en réunion. Tu dis…", ["« Il est en réunion, puis-je prendre un message ? »", "« Il ne veut pas vous parler »", "« Rappelez jamais »", "rien"], "Filtrer avec tact."], ["Un appelant demande l'adresse personnelle d'un collègue. Tu…", ["refuses poliment et proposes de transmettre un message", "la donnes", "la cherches sur internet", "raccroches"], "Discrétion."], ["Dans une lettre, l'objet indique…", ["le sujet de la lettre en quelques mots", "la date", "la signature", "la formule de politesse"], "Placé avant la formule d'appel."], ["Formule de fin adaptée à un courrier officiel :", ["Veuillez agréer, Madame, l'expression de mes salutations distinguées.", "Bisous", "À plus", "Salut"], "Adaptée au destinataire."], ["Un bon courriel a…", ["un objet précis et un message court", "pas d'objet", "dix pièces jointes non vérifiées", "un texte en majuscules"], "Une demande claire."], ["Un compte i><li>Message d'absence avec date de retour et contact de remplacement.</li></ul>"], ["Sécurité informatique", "<ul><li>Mots de passe longs, différents pour chaque compte, jamais notés sur un papier collé à l'écran.</li><li><b>Hameçonnage</b> : courriel qui imite une banque ou un fournisseur pour voler des identifiants ou faire payer une fausse facture ; vérifier l'adresse de l'expéditeur, ne pas cliquer, appeler le vrai contact.</li><li>Changement de RIB d'un fournisseur par courriel : toujours vérifier par téléphone au numéro habituel.</li><li>Verrouiller son poste quand on s'absente (touche Windows + L).</li><li>Sauvegarder les fichiers importants régulièrement.</li></ul>"]], "q": [["Les styles dans Word servent à…", ["une mise en page homogène et une table des matières automatique", "changer de couleur au hasard", "envoyer des courriels", "faire des calculs"], "Titre 1, Titre 2, Normal."], ["Le publipostage permet…", ["d'envoyer un même courrier personnalisé à une liste", "de publier sur Facebook", "de poster un colis", "de corriger l'orthographe"], "Avec un fichier de destinataires."], ["Pour qu'un document ne soit pas modifié, on l'envoie en…", ["PDF", "brouillon", "photo floue", "fichier vide"], "Format figé."], ["Formule pour compter les courriers « en attente » dans une liste ?", ["NB.SI", "SOMME", "MAX", "ARRONDI"], "=NB.SI(plage;\"en attente\")."], ["Dans un tableau de données, on évite…", ["de fusionner des cellules", "les titres de colonnes", "les filtres", "les tris"], "Ça bloque tris et filtres."], ["Figer la première ligne sert à…", ["garder les titres visibles en descendant", "protéger le fichier", "imprimer", "colorer"], "Longues listes."], ["La copie cachée (Cci) sert à…", ["envoyer à plusieurs sans montrer les adresses", "cacher le message", "supprimer le courriel", "répondre à tous"], "Respect des adresses."], ["Répondre à tous, c'est…", ["seulement si tout le monde est concerné", "toujours", "jamais", "obligatoire"], "Évite d'encombrer les boît   const fmtn=v=>String(v).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g," ");
  (function show(){halt();const Q=A.it[i];window.scrollTo(0,0);
    app.innerHTML=hdr(`Atelier · ${i+1}/${A.it.length}`)+`<div class="card"><span class="tag">${A.t}</span><p class="q">${Q.q}</p>${tmax?`<div class="timer" id="tmr" style="font-size:22px"></div>`:""}<div id="zone"></div><div id="fb"></div></div>`;
    bindBack(back);const z=document.getElementById("zone"),fb=document.getElementById("fb");
    const fin=(sc,msg)=>{halt();pts+=sc;z.querySelectorAll("button,input").forEach(x=>x.disabled=true);
      fb.innerHTML=`<div class="fb" style="border-color:${sc===1?"var(--ok)":sc>0?"var(--gold)":"var(--ko)"}"><b>${msg}</b> ${Q.x}</div><button class="btn" id="nx">${i<A.it.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<A.it.length?show():done(Math.round(pts/A.it.length*100))}};
    if(typeof XK!=="undefined"&&XK[Q.k]){XK[Q.k](Q,z,fin);return}
    if(Q.k==="num"){z.innerHTML=`<div class="row"><input id="ans" type="text" inputmode="decimal" placeholder="Ta réponse" style="flex:2;padding:13px;border-radius:11px;border:1.5px solid var(--line);font:inherit;background:var(--bg);color:var(--ink)"><span style="flex:0 0 auto;font-weight:700">${Q.u}</span></div><button class="btn" id="val">Valider</button>`;
      const check=()=>{const raw=document.getElementById("ans").value.replace(/\s/g,"").replace(",",".");const v=parseFloat(raw);if(isNaN(v))return toast("Entre un nombre.");const ok=Math.abs(v-Q.a)<=Q.tol+1e-9;fin(ok?1:0,ok?"Exact.":`La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`)};
      document.getElementById("val").onclick=check;document.getElementById("ans").onkeydown=e=>{if(e.key==="Enter")check()};
      if(tmax)count(tmax,document.getElementById("tmr"),()=>fin(0,`Temps écoulé. La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`))}
    else{const pool=shuf(Q.it.map((t,k)=>[t,k]));let pick=[];
      const draw=()=>{z.innerHTML=`<p class="mut">Touche les étapes dans l'ordre. Touche une étape déjà placée pour l'enlever.</p><div id="chosen">${pick.map((p,n)=>`<button class="opt" data-p="${n}" style="border-color:var(--lag)"><b>${n+1}.</b> ${p[0]}</button>`).join("")}</div>${pick.length<pool.length?`<p class="mut" style="margin-top:10px">À placer :</p>`:""}<div>${pool.filter(p=>!pick.includes(p)).map(p=>`<button class="opt" data-k="${p[1]}">${p[0]}</button>`).join("")}</div>${pick.length===pool.length?`<button class="btn" id="val">Valider l'ordre</button>`:""}`;
        z.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pick.push(pool.find(p=>p[1]===+b.dataset.k));draw()});
        z.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.p,1);draw()});
        const v=document.getElementById("val");if(v)v.onclick=()=>{const good=pick.filter((p,n)=>p[1]===n).length,sc=good/pool.length;
          z.innerHTML=`<p class="mut">Ordre correct :</p>`+Q.it.map((t,n)=>`<div class="opt ${pick[n][1]===n?"good":"bad"}"><b>${n+1}.</b> ${t}</div>`).join("");fin(sc===1?1:Math.round(sc*100)/100,sc===1?"Exact.":`${good} étape(s) bien placée(s) sur ${pool.length}.`)}};
      draw();if(tmax)count(tmax*1.5,document.getElementById("tmr"),()=>{z.innerHTML=Q.it.map((t,n)=>`<div class="opt"><b>${n+1}.</b> ${t}</div>`).join("");fin(0,"Temps écoulé.")})}})()}

/* ===================== MOTEUR ===================== */
const NS=L.length*5,KEY="ohipa-sec-v1",DAYN=["J1","J2","J3","J4","J5"];
let S={s:{},xp:0,w:[],days:[],free:false,txt:{},ex:[]},tm=null;
const app=document.getElementById("app"),nav=document.getElementById("nav");
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rng=(a,b)=>Array.from({length:b-a},(_,i)=>a+i);
const today=()=>new Date().toISOString().slice(0,10);
function mix(n,l){ // révision : erreurs d'abord, puis tirage dans les niveaux déjà vus
  const pool=[];for(let i=0;i<=l;i++)L[i].q.forEach((_,k)=>pool.push(i+"."+k));
  const w=shuf(S.w.filter(k=>pool.includes(k))),rest=shuf(pool.filter(k=>!w.includes(k)));
  return w.concat(rest).slice(0,n).map(k=>k.split(".").map(Number));}
function plan(l,d){const Q=a=>a.map(k=>[l,k]),m=SIMMAP[l],sn=m==="dil"?"Dilemme du métier":"Atelier : "+AT[+m.slice(2)].t;
  return [
  [{k:"lire",f:[0],m:4},{k:"quiz",q:()=>Q(rng(0,6)),m:5},{k:"cas",c:[0],m:4}],
  [{k:"lire",f:[1],m:4},{k:"quiz",q:()=>Q(rng(6,12)),m:5},{k:"sim",m:6,n:sn}],
  [{k:"lire",f:[2],m:4},{k:"cas",c:[1],m:4},{k:"quiz",q:()=>mix(6,l),m:4,n:"Révision"}],
  [{k:"lire",f:[3],m:4},{k:"oral",o:[0],m:5},{k:"quiz",q:()=>mix(6,l),m:4,n:"Révision ciblée"}],
  [{k:"oral",o:[1],m:5},{k:"quiz",q:()=>shuf(Q(rng(0,12))),m:8,n:"Défi du niveau"}]][d];}
const LBL={sim:["🧩","Simulation"],lire:["📖","Fiches à lire"],quiz:["✅","Quiz"],cas:["🧭","Mise en situation"],oral:["🎙️","Face au recruteur"],ecrit:["✍️","Cas écrit"]};
const sk=(l,d,i)=>l+"."+d+"."+i;
const dayDone=(l,d)=>plan(l,d).every((_,i)=>sk(l,d,i) in S.s);
function curDay(){for(let n=0;n<NS;n++){const l=Math.floor(n/5),d=n%5;if(!dayDone(l,d))return n}return NS}
function streak(){let n=0,dt=new Date();const has=x=>S.days.includes(x.toISOString().slice(0,10));
  if(!has(dt))dt.setDate(dt.getDate()-1);while(has(dt)){n++;dt.setDate(dt.getDate()-1)}return n}
const RANKS=[[0, "Débutant"], [150, "Agent d'accueil"], [400, "Secrétaire"], [800, "Assistant"], [1300, "Assistant confirmé"], [1900, "Assistant de direction"], [2600, "Office manager"]];
function rank(){let r=RANKS[0],nx=null;for(const x of RANKS){if(S.xp>=x[0])r=x;else{nx=x;break}}return{r,nx}}
function gain(key,score){const first=!(key in S.s);const xp=first?10+Math.round(score/5):5;
  if(key)S.s[key]=Math.max(S.s[key]||0,score);S.xp+=xp;if(!S.days.includes(today()))S.days.push(today());save();return xp}
const TTS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
let AU=null,AUSRC=null,AUBLOB={};
function hush(){try{if(TTS)speechSynthesis.cancel()}catch(e){}try{if(AU){AU.pause();AU=null}}catch(e){}}
function prefetch(src){AUSRC=src;if(!src||AUBLOB[src])return;try{fetch(src).then(r=>r.ok?r.blob():null).then(b=>{if(b)AUBLOB[src]=URL.createObjectURL(b)}).catch(()=>{})}catch(e){}}
function toast(t){let d=document.getElementById("tst");if(!d){d=document.createElement("div");d.id="tst";d.style.cssText="position:fixed;left:12px;right:12px;bottom:80px;background:#14323a;color:#fff;padding:12px 14px;border-radius:12px;font-size:14.5px;z-index:9";document.body.appendChild(d)}d.textContent=t;d.style.display="block";clearTimeout(d._t);d._t=setTimeout(()=>d.style.display="none",6000)}
function playFile(btn){const src=AUBLOB[AUSRC]||AUSRC;try{const a=new Audio(src);AU=a;a.onended=a.onerror=()=>{if(AU===a){AU=null;btn.textContent="🔊 Écouter"}};const pr=a.play();btn.textContent="⏹ Arrêter";if(pr&&pr.catch)pr.catch(()=>{AU=null;btn.textContent="🔊 Écouter";toast("Lecture impossible ici. Ouvre le jeu dans Chrome pour l'écouter.")})}catch(e){toast("Lecture impossible ici.")}}
function halt(){if(tm){clearInterval(tm);tm=null}hush()}
function readOut(btn){
  if(AU||(TTS&&speechSynthesis.speaking)){hush();btn.textContent="🔊 Écouter";return}
  if(!TTS)return toast("La lecture audio utilise la voix du téléphone : ouvre le jeu dans Chrome ou installe l'application (Profil).")
  try{
  const box=document.createElement("div");app.querySelectorAll(".card").forEach(c=>box.appendChild(c.cloneNode(true)));
  box.querySelectorAll("textarea,.timer,.btn,.tag,.av,input").forEach(x=>x.remove());
  box.querySelectorAll("li,p,h2,h3,.opt,.fb,label,b").forEach(x=>x.append(". "));
  const txt=box.textContent.replace(/[✓✗≈«»]/g," ").replace(/\s+/g," ").trim();if(!txt)return;
  const parts=txt.match(/[^.!?]+[.!?]*/g)||[txt];let n=0;
  parts.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;
    u.onend=u.onerror=()=>{if(++n>=parts.length)btn.textContent="🔊 Écouter"};speechSynthesis.speak(u)});
  btn.textContent="⏹ Arrêter"}catch(e){}}
function hdr(title,back){return `<div class="top"><button class="back" id="bk">←</button><b>${title}</b><button class="au" id="au">🔊 Écouter</button></div>`}

function setNav(v){const it=[["home","🏝️","Accueil"],["parcours","🗺️","Parcours"],["fiches","📚","Fiches"],["exam","⏱️","Entretien"],["profil","👤","Profil"]];

  const g=document.getElementById("goDay");if(g)g.onclick=()=>go("day",l,d);

function timerBox(sec){return `<div class="timer" id="tmr">${fmt(sec)}</div><div class="row"><button class="btn sec" id="tgo" style="margin:0">Démarrer le chrono</button></div>`}
const fmt=s=>(s>=3600?Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0"):Math.floor(s/60))+":"+String(s%60).padStart(2,"0");

    bindBack(back);document.getElementById("ok").onclick=()=>{let n=0;app.querySelectorAll("select").forEach(x=>n+=+x.value);note20(o.t,n,back)}}}
function examQCM(){AUSRC=null;const back=()=>go("exam"),pool=[];L.forEach((x,l)=>x.q.forEach((_,k)=>pool.push([l,k])));const items=shuf(pool).slice(0,30),res=[];let i=0,over=false;

const DIFF=["Normal","Difficile","Expert"];
const dif=()=>S.diff||0;
function simu(done,back){const st=Object.assign({},SIMCFG.st),fl={},log=[],D=dif(),mult=D===2?1.5:D===1?1.25:1,tmax=D===2?40:D===1?75:0;let i=0;
  const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
  const bars=()=>D===2?`<p class="mut">Mode expert : indicateurs masqués jusqu'au bilan.</p>`:Object.keys(IND).map(k=>`<div style="display:flex;gap:8px;align-items:center;font-size:13px"><span style="flex:0 0 150px">${IND[k]}</span><div class="bar" style="flex:1;margin:3px 0"><i style="width:${st[k]}%;background:${st[k]<40?"var(--ko)":st[k]<60?"var(--gold)":"var(--ok)"}"></i></div></div>`).join("");
  app.innerHTML=hdr(SIMCFG.title)+`<div class="card fiche"><h2 style="margin-top:0">${SIMCFG.head}</h2><p>${SIMCFG.intro} <b>Chaque décision change la suite</b> : certaines situations n'arrivent que parce que tu as choisi quelque chose avant.</p><ul><li>Six indicateurs : ${Object.values(IND).join(", ").toLowerCase()}.</li><li>Niveau : <b>${DIFF[D]}</b>${tmax?` · ${tmax} secondes par décision, sinon la situation décide pour toi`:""}${D>=1?" · explications seulement au bilan":""}.</li><li>Change le niveau dans Profil.</li></ul><button class="btn" id="go">${SIMCFG.start}</button></div>`;
  bindBack(back);document.getElementById("go").onclick=next;
  function next(){halt();while(i<EV.length&&EV[i].when&&!EV[i].when(fl))i++;if(i>=EV.length)return bilan();const E=EV[i],o=shuf(E.o.map((x,k)=>[x,k]));window.scrollTo(0,0);
    app.innerHTML=hdr(E.j)+`<div class="card">${bars()}</div><div class="card"><h2 style="margin-top:0">${E.t}</h2><p>${E.s}</p>${tmax?`<div class="timer" id="tmr"></div>`:""}${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0][0]}</button>`).join("")}<div id="fb"></div></div>`;
    bindBack(back);
    const pick=j=>{halt();const opt=j<0?["Aucune décision prise à temps.",SIMCFG.none,[],"Ne pas décider est une décision : la situation s'est dégradée sans toi."]:o[j][0];
      Object.entries(opt[1]).forEach(([k,v])=>st[k]=clamp(st[k]+(v<0?v*mult:v)));opt[2].forEach(f=>fl[f]=1);
      const best=Math.max(...E.o.map(x=>Object.values(x[1]).reduce((s,v)=>s+v,0)));const mine=Object.values(opt[1]).reduce((s,v)=>s+v,0);
      log.push({j:E.j,t:E.t,c:opt[0],fb:opt[3],ok:mine>=best});i++;
      if(D===0){app.querySelectorAll(".opt").forEach(b=>b.disabled=true);if(j>=0)app.querySelectorAll(".opt")[j].classList.add(mine>=best?"good":"bad");document.getElementById("fb").innerHTML=`<div class="fb">${opt[3]}</div><button class="btn" id="nx">Continuer</button>`;document.getElementById("nx").onclick=next}else next()};
    app.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>pick(j));
    if(tmax)count(tmax,document.getElementById("tmr"),()=>pick(-1))}
  function bilan(){window.scrollTo(0,0);const w=SIMCFG.w,tot=Object.keys(w).reduce((s,k)=>s+st[k]*w[k],0)/Object.values(w).reduce((s,v)=>s+v,0);
    let sc=Math.round(tot);if(SIMCFG.crit.some(k=>st[k]<45)||SIMCFG.cap(fl))sc=Math.min(sc,45);
    const nb=log.filter(x=>x.ok).length,grade=SIMCFG.grades[sc>=85?0:sc>=70?1:sc>=55?2:3];
    const chains=CHAINS.filter(c=>c[0](fl)).map(c=>c[1]);
    app.innerHTML=hdr("Bilan du mois")+`<div class="card" style="text-align:center"><h2>${sc}/100</h2><p><b>${grade}</b> · ${nb} meilleures décisions sur ${log.length}</p></div><div class="card">${Object.keys(IND).map(k=>`<p style="display:flex;justify-content:space-between;margin:4px 0"><span>${IND[k]}</span><b style="color:${st[k]<40?"var(--ko)":st[k]<60?"var(--gold)":"var(--ok)"}">${st[k]}</b></p>`).join("")}</div>${chains.length?`<div class="card warn"><h3>L'effet domino</h3><ul class="mut" style="padding-left:18px">${chains.map(c=>`<li>${c}</li>`).join("")}</ul></div>`:""}<h2>Tes décisions</h2>${log.map(x=>`<details class="card"><summary>${x.ok?"✓":"✗"} <b>${x.j}</b> · ${x.t}</summary><p><b>Ton choix :</b> ${x.c}</p><div class="fb">${x.fb}</div></details>`).join("")}<button class="btn" id="ok">Terminer</button>`;
    bindBack(back);document.getElementById("ok").onclick=()=>{S.ex.unshift([today(),"Un mois aux RH · "+DIFF[D],Math.round(sc/5*10)/10]);S.ex=S.ex.slice(0,30);done(sc)}}}

function dilem(done,back){let i=0,pts=0;const items=shuf(DIL).slice(0,dif()>=1?10:6),hard=dif()>=1;const recap=[];
  (function show(){const C=items[i],o=shuf(C.o);window.scrollTo(0,0);
    app.innerHTML=hdr(`Dilemme ${i+1}/${items.length}`)+`<div class="card"><h2 style="margin-top:0">${C.t}</h2><p>${C.s}</p>${dif()>=2?`<div class="timer" id="tmr"></div>`:""}${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0]}</button>`).join("")}<div id="fb"></div></div>`;
    bindBack(back);

  const res=[];SIDX.forEach(e=>{const ti=" "+nrm(e[3]).replace(/[^a-z0-9₂%]+/g," "),lv=" "+nrm(e[4]).replace(/[^a-z0-9₂%]+/g," ");let sc=0;for(const x of w){if(ti.includes(" "+x))sc+=10;else if(lv.includes(" "+x))sc+=4;else if((" "+e[5]).includes(" "+x))sc+=1;else return}res.push([sc,e])});

  return {done,lvl:Math.min(3,Math.floor(done/5)+1),xp,g,ex:ex.length,best,steps:Object.keys(s).length,days:(S.days||[]).length,last:(S.days||[]).slice(-1)[0]||null}}

  (lt?`<div class="card hero"><small>Reprendre</small><h2 style="margin:4px 0 0;color:#fff">${lt.ic} ${lt.name}</h2><button class="btn wh" id="resume" style="color:${lt.col[0]}">Continuer</button></div>`:"")+
  `<h2>Les voies</h2><div class="vgrid">`+TRACKS.map(t=>{const p=prog(t),rec=QR()&&QR().top.includes(t.id);
    return `<button class="vt" data-t="${t.id}" style="--c:${t.col[0]};--c2:${t.col[1]}"><span class="vi">${t.ic}</span>${rec?`<em>conseillée</em>`:""}<b>${t.name}</b><small>${t.hint}</small>${p.steps?`<span class="vb"><i style="width:${Math.max(6,Math.round(p.done/15*100))}%"></i></span><small class="vs">Niveau ${p.lvl} · ${p.xp} pts</small>`:""}</button>`}).join("")+`</div>`+
  `<button class="btn sec" id="fiche">📄 Ma fiche de progression</button>`+`<div class="card" id="scard"><h3 style="margin-top:0">🔎 Rechercher une fiche</h3><input id="sq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Ex. : monnaie, check-in, TVA, consignation…" style="width:100%;box-sizing:border-box;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)"><div id="sres"></div></div>`+
  `<div class="card" id="appcard"><h3>Application</h3><p class="mut" id="ver">Version ${V}${standalone()?" · installée":""}</p><div id="upbar" style="display:none;height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0"><i style="display:block;height:100%;width:5%;background:var(--ok);transition:width .2s"></i></div>
   <button class="btn" id="upd">🔄 Mettre à jour</button>${inApk?"":`<button class="btn sec" id="ins">📲 Installer sur le téléphone</button>`}${apk&&!inApk?`<a class="btn sec" id="apk" href="${apk}" style="text-decoration:none">⬇️ Télécharger l'APK Android</a>`:""}
   <p class="mut" style="margin-top:10px">Ta progression est enregistrée sur cet appareil, avec une copie de secours${NAT?" dans l'application Android":""}.</p>
   <details style="margin-top:6px"><summary class="mut" style="cursor:pointer">💾 Sauvegarder ou restaurer toute ma progression</summary>
   <p class="mut">Copie ce code et garde-le (note, message à toi-même). Il contient toutes les voies. Colle-le sur un autre téléphone ou après une réinstallation.</p>
   <button class="btn sec" id="bk">Créer mon code de sauvegarde</button><textarea id="bkt" style="min-height:70px;display:none" readonly></textarea>
   <textarea id="rst" style="min-height:60px;margin-top:8px" placeholder="Colle ici un code de sauvegarde…"></textarea><button class="btn sec" id="rsb">Restaurer</button></details>
   ${location.protocol==="file:"?`<p class="mut" style="color:var(--cor)">Tu utilises la copie hors ligne de l'application. Touche « Mettre à jour » pour revenir à la version en ligne quand tu as du réseau.</p>`:""}</div>
  <div class="card warn"><h3>À savoir</h3><p class="mut">Te ʻOhipa donne un avant-goût des métiers et prépare aux entretiens d'embauche. Il ne remplace ni le formateur, ni la formation, ni le diplôme ; les habilitations et les règles de chaque entreprise font foi.</p></div>`;
  document.getElementById("nav").innerHTML="";
  const sq=document.getElementById("sq");let st0;sq.oninput=()=>{clearTimeout(st0);if(!sq.value)try{localStorage.removeItem("oh-q")}catch(_){}st0=setTimeout(()=>search(sq.value),150)};sq.onkeydown=e=>{if(e.key==="Enter"){sq.blur();search(sq.value)}};const q0=ls("oh-q");if(q0){sq.value=q0;search(q0)}
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>start(TRACKS.find(t=>t.id===b.dataset.t)));
  const qz=document.getElementById("qz");if(qz)qz.onclick=()=>quiz();document.getElementById("fiche").onclick=fiche;
  const r=document.getElementById("resume");if(r)r.onclick=()=>start(lt);
  document.getElementById("upd").onclick=updateApp;
  document.getElementById("bk").onclick=()=>{const t=document.getElementById("bkt");t.value=backupCode();t.style.display="block";t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast("Code copié."),()=>{})}catch(e){}};
  document.getElementById("rsb").onclick=()=>{const c=document.getElementById("rst").value;if(!c.trim())return toast("Colle d'abord un code.");try{const n=restoreCode(c);sync();toast(n+" éléments restaurés.");setTimeout(()=>location.reload(),900)}catch(e){toast("Code invalide.")}};const i=document.getElementById("ins");if(i)i.onclick=installApp;
  if(hosted)try{fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(x=>x.json()).then(j=>{if(j&&j.v&&j.v!==V){document.getElementById("ver").innerHTML=`Version ${V} · <b style="color:var(--cor)">nouvelle version ${j.v} disponible</b>`;document.getElementById("appcard").style.borderColor="var(--cor)"}}).catch(()=>{})}catch(e){}}
if(ls("oh-seen"))hub();else welcome();
})();

</script>
</body>
</html>

<title>Te ʻOhipa – Trouve ton métier</title>
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#14323a;--mut:#5d7379;--line:#e2dbcb;--lag:#0f6e78;--lag2:#d9eeee;--cor:#d9552f;--ok:#2c8a57;--okb:#e2f3e8;--ko:#b8402a;--kob:#f9e4de;--gold:#c8962e}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:14px 14px 96px}
h1{font:700 26px/1.15 Georgia,"Times New Roman",serif;margin:6px 0 2px;letter-spacing:-.01em}
h2{font:700 20px/1.2 Georgia,serif;margin:18px 0 8px}
h3{font-size:16px;margin:0 0 4px}
p{margin:6px 0}
small,.mut{color:var(--mut);font-size:13.5px}
.band{height:10px;border-radius:6px;margin:0 0 12px;background:repeating-linear-gradient(135deg,var(--lag) 0 10px,var(--cor) 10px 14px,var(--gold) 14px 18px,var(--lag) 18px 28px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.hero{background:var(--lag);color:#fff;border:0}
.hero small,.hero .mut{color:#d6efef}
@media(prefers-color-scheme:dark){.hero{background:#0f6e78}}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 14px;background:var(--cor);color:#fff;font-weight:700;margin-top:10px;text-align:center}
.btn.sec{background:transparent;color:var(--lag);border:2px solid var(--lag)}
.btn.wh{background:#fff;color:#0f6e78}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.stat{text-align:center;padding:10px 4px}
.stat b{display:block;font:700 22px Georgia,serif}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}

.lvl{display:flex;gap:12px;align-items:flex-start}
.num{flex:0 0 38px;height:38px;border-radius:50%;background:var(--lag2);color:var(--lag);display:grid;place-items:center;font-weight:800}
.days{display:flex;gap:6px;margin-top:8px}
.day{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 0;text-align:center;font-weight:700;font-size:14px}

.q{font-weight:650;font-size:17px;margin:2px 0 10px}

.opt.good{background:var(--okb);border-color:var(--ok)}

.fb{border-left:4px solid var(--lag);background:var(--lag2);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:10px;font-size:15px}
.fiche ul{margin:6px 0;padding-left:20px}.fiche li{margin:4px 0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{border:0;background:var(--lag2);color:var(--lag);border-radius:10px;padding:8px 12px;font-weight:700}
.au{margin-left:auto;border:0;background:var(--lag2);color:var(--lag);border-radius:10px;padding:8px 12px;font-weight:700}
.jur{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.av{flex:0 0 44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.timer{font:700 34px/1 Georgia,serif;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:11px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}

nav button span{display:block;font-size:19px}
nav button.on{color:var(--cor);font-weight:700}
details.card summary{cursor:pointer}select{font:inherit;padding:6px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.pg{border-collapse:collapse;font-size:12.5px;width:100%}.pg th{font-weight:700;padding:2px 3px;white-space:nowrap}.pg td{padding:1px;text-align:center}.pc{display:block;width:100%;min-width:30px;height:32px;border:1px solid var(--line);border-radius:6px;font-weight:800;font-size:13px;color:#14323a;line-height:30px}.pc.lk{opacity:.85;border-style:dashed}.ph{font-size:12px;padding-left:4px}.cv{font-size:11.5px;font-weight:700}
.tag{display:inline-block;background:var(--lag2);color:var(--lag);border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:700}
.warn{border-left:4px solid var(--gold)}
a{color:var(--lag)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card,#fff);border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;color:inherit;cursor:pointer;min-height:104px}.tile[hidden]{display:none}.tile span{font-size:26px}.tile b{font-size:15.5px}.tile small{color:var(--mut);font-size:12.5px;line-height:1.3}.tile:active{transform:scale(.98)}.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}.vt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card,#fff);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:16px;padding:12px 12px 14px;min-height:150px}.vt .vi{font-size:24px;width:44px;height:44px;border-radius:12px;background:var(--c2);display:flex;align-items:center;justify-content:center;margin-bottom:4px}.vt b{font-size:15.5px;line-height:1.25}.vt small{color:var(--mut);font-size:12.5px;line-height:1.3}.vt em{position:absolute;top:10px;right:10px;font-style:normal;font-size:11px;font-weight:700;background:#fff4c2;color:#7a5600;border-radius:999px;padding:2px 8px}.vb{display:block;width:100%;height:6px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.vb i{display:block;height:100%;background:var(--c)}.vt .vs{color:var(--c);font-weight:600}@media print{.noprint,#nav,.band{display:none!important}body{background:#fff}.card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}}.chg{float:right;border:1px solid var(--line);background:var(--card);color:var(--lag);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;margin-top:6px}
.voie .ic{flex:0 0 44px;height:44px;font-size:22px;border-radius:12px}
.voie b{font-size:16.5px}
.pg{height:6px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ok)}
</style>

<script>
const TRACKS=[];
TRACKS.push(Object.assign({"id": "hot", "key": "ohipa-hot-v1", "ic": "🏨", "name": "Hôtellerie et tourisme", "sub": "Réception, étages, anglais professionnel, accueil des visiteurs", "col": ["#0f6e78", "#d9eeee", "#4fc0c5", "#1d4750"], "hint": "1er secteur qui recrute au fenua", "ranks": ["Stagiaire", "Débutant", "Employé", "Employé confirmé", "Référent", "Chef d'équipe", "Responsable"]},{run:function(){
"use strict";
const J={"DIR": {"n": "Mme Tumata", "r": "Directrice d'hôtel", "c": "#0f6e78"}, "GOU": {"n": "M. Heimana", "r": "Gouvernant général", "c": "#b8402a"}, "REC": {"n": "Mme Vaiana", "r": "Cheffe de réception", "c": "#3d5a99"}, "RH": {"n": "M. Taaroa", "r": "Responsable du personnel", "c": "#2c8a57"}};
const GRILLE=["Accueil souriant et formule de politesse", "Phrases courtes et claires", "Solution proposée au client", "Anglais simple et poli", "Respect des procédures de l'hôtel", "Relecture"];
const X=[["DIR", "Pourquoi voulez-vous travailler dans l'hôtellerie ?", ["Goût du service", "Accueillir des visiteurs du monde entier", "Fierté de présenter le fenua", "Travail en équipe", "Disponibilité aux horaires décalés"]], ["REC", "Un client arrive fatigué et sa chambre n'est pas prête. Que faites-vous ?", ["S'excuser sincèrement", "Proposer un rafraîchissement et la bagagerie", "Donner une heure précise", "Prévenir les étages", "Le rappeler dès que c'est prêt"]], ["GOU", "Comment organisez-vous le nettoyage d'une chambre ?", ["Aérer, retirer le linge sale", "Du haut vers le bas, du propre vers le sale", "Salle de bain à part", "Réassort des produits", "Contrôle final"]], ["RH", "Parlez-vous anglais ? Présentez-vous en anglais.", ["Prénom, origine", "Expérience", "Phrase de bienvenue", "Rester simple", "Sourire"]]];

const CRIT=["Sens du service", "Communication et anglais", "Respect des procédures", "Gestion des imprévus", "Présentation"];
const L=[{"t": "Accueillir, réceptionner, préparer les chambres", "s": "Réception, étages, anglais professionnel, tourisme au fenua.", "f": [["Les métiers de l'hôtellerie", "<ul><li><b>Réceptionniste</b> : accueille, enregistre l'arrivée (<b>check-in</b>) et le départ (<b>check-out</b>), encaisse, informe, gère les réservations.</li><li><b>Employé d'étage / femme ou valet de chambre</b> : nettoie et prépare les chambres selon les standards de l'hôtel.</li><li><b>Gouvernant(e)</b> : organise et contrôle le travail des étages.</li><li><b>Concierge</b>, <b>bagagiste</b>, <b>guest relation</b> : services et attentions au client.</li><li><b>Guide</b> et <b>prestataire d'activités</b> : excursions, lagon, plongée, culture.</li><li>Au fenua, l'hôtellerie et la restauration sont le premier secteur qui recrute, surtout à Tahiti, Bora Bora et Moorea.</li><li>Qualités attendues : sourire, ponctualité, discrétion, tenue soignée, endurance, <b>anglais</b>.</li></ul>"], ["L'accueil du client", "<ul><li>Les <b>10 premières secondes</b> comptent : regard, sourire, salutation (<b>« Ia ora na, welcome! »</b>).</li><li>Appeler le client par son nom dès qu'on le connaît.</li><li>Écouter jusqu'au bout, reformuler la demande.</li><li>Ne jamais dire « ce n'est pas mon travail » : on trouve la personne qui peut aider.</li><li><b>Réclamation</b> : écouter sans couper, s'excuser, proposer une solution, agir, vérifier que le client est satisfait.</li><li>Discrétion : on ne donne jamais le numéro de chambre d'un client à voix haute ni à un inconnu.</li><li>Présenter le fenua avec fierté : un mot de reo tahiti, une info sur l'île, un conseil d'activité.</li></ul>"], ["Préparer une chambre", "<ul><li><b>Ordre de travail</b> : frapper et s'annoncer (« Housekeeping! »), aérer, retirer le linge sale et les déchets, faire le lit, dépoussiérer <b>du haut vers le bas</b>, nettoyer la salle de bain, réassort (produits, serviettes, eau), sol en dernier, contrôle final.</li><li><b>Du propre vers le sale</b> : on ne passe pas le chiffon des toilettes sur le lavabo. Codes couleur des chiffons.</li><li>Chambre <b>en départ</b> (nettoyage complet) ou <b>en recouche</b> (client qui reste : on respecte ses affaires).</li><li>Objet oublié : on le déclare à la gouvernante, jamais on ne le garde.</li><li>Signaler toute panne ou anomalie (clim, fuite) au service technique.</li><li>Produits : gants, pas de mélange (javel et acide), aération.</li></ul>"], ["L'anglais de l'hôtel", "<ul><li><b>Welcome to Tahiti! / Ia ora na!</b> : bienvenue.</li><li><b>May I have your name, please?</b> : puis-je avoir votre nom ?</li><li><b>Your room is ready / will be ready at 2 pm.</b> : votre chambre est prête / sera prête à 14 h.</li><li><b>Breakfast is served from 6:30 to 10 am.</b> : le petit-déjeuner est servi de 6 h 30 à 10 h.</li><li><b>I'm sorry for the inconvenience. Let me fix it.</b> : désolé pour le désagrément, je m'en occupe.</li><li><b>Check-out is at 11 am.</b> : le départ est à 11 h.</li><li><b>Have a nice stay! / Māuruuru!</b> : bon séjour ! / merci !</li><li>Parler lentement, sourire, utiliser des phrases courtes : le client apprécie l'effort plus que la perfection.</li></ul>"]], "q": [["Le check-in désigne…", ["l'arrivée et l'enregistrement du client", "le départ du client", "le nettoyage de la chambre", "le paiement du restaurant"], "Le check-out est le départ."], ["Qui organise et contrôle le travail des étages ?", ["la ou le gouvernant", "le bagagiste", "le concierge", "le cuisinier"], "Il encadre les femmes et valets de chambre."], ["Face à une réclamation, on commence par…", ["écouter le client sans le couper", "expliquer que ce n'est pas notre faute", "appeler la direction tout de suite", "donner une remise"], "Écouter, s'excuser, proposer, agir, vérifier."], ["Un inconnu demande le numéro de chambre d'un client. Tu…", ["refuses poliment et proposes d'appeler le client", "le lui donnes", "le cries à travers le hall", "l'écris sur un papier"], "Sécurité et discrétion."], ["Le nettoyage d'une chambre se fait…", ["du haut vers le bas, du propre vers le sale", "du bas vers le haut", "dans n'importe quel ordre", "en commençant par les toilettes puis le lavabo avec le même chiffon"], "Codes couleur des chiffons."], ["Une chambre en recouche est…", ["la chambre d'un client qui reste", "une chambre vide", "une chambre à rénover", "la chambre du personnel"], "On respecte ses affaires."], ["Tu trouves une montre oubliée dans une chambre. Tu…", ["la déclares à la gouvernante", "la gardes", "la laisses sur place sans rien dire", "la donnes au prochain client"], "Objets trouvés : procédure de l'hôtel."], ["On ne mélange jamais…", ["javel et produit acide", "eau et savon", "deux serviettes", "linge blanc et linge blanc"], "Dégagement de gaz toxique."], ["« Your room will be ready at 2 pm » signifie…", ["votre chambre sera prête à 14 h", "votre chambre est la numéro 2", "le petit-déjeuner est à 14 h", "votre départ est à 14 h"], "pm = après-midi."], ["« I'm sorry for the inconvenience » sert à…", ["s'excuser d'un désagrément", "souhaiter la bienvenue", "dire au revoir", "demander le nom"], "Puis : Let me fix it."], ["Le premier secteur qui recrute au fenua est…", ["l'hôtellerie-restauration", "l'agriculture", "l'industrie lourde", "les banques"], "Surtout à Tahiti, Bora Bora et Moorea."], ["Une qualité indispensable en réception internationale est…", ["parler anglais", "savoir cuisiner", "conduire un bateau", "connaître la comptabilité analytique"], "Les réceptionnistes bilingues sont très recherchés."]], "c": [{"t": "La chambre pas prête", "s": "Un couple arrive à 10 h après un vol de nuit. Le check-in est à 14 h et leur chambre n'est pas prête.", "o": [["Tu t'excuses, proposes la bagagerie, un rafraîchissement et l'accès à la piscine, tu préviens les étages et tu les rappelles dès que la chambre est prête.", 2, "Solution concrète, client pris en charge."], ["Tu leur dis de revenir à 14 h.", 0, "Ils se sentent abandonnés."], ["Tu leur donnes une autre chambre réservée par d'autres clients.", 0, "Tu crées un problème pour d'autres."], ["Tu demandes aux étages de faire vite, sans rien proposer aux clients.", 1, "Bonne idée, mais les clients attendent sans attention."]]}, {"t": "La clim en panne", "s": "Une cliente appelle à 22 h : la climatisation de sa chambre ne marche plus.", "o": [["Tu t'excuses, appelles le technicien de garde, proposes un ventilateur ou un changement de chambre, et rappelles la cliente.", 2, "Réponse rapide et suivie."], ["Tu lui dis d'ouvrir la fenêtre.", 0, "Aucune solution réelle."], ["Tu promets que ce sera réparé demain.", 1, "Elle passe une mauvaise nuit."], ["Tu ne réponds pas, ce n'est pas ton service.", 0, "Jamais."]]}], "o": [["REC", "Comment gérez-vous un client mécontent à la réception ?", ["Écouter sans couper", "S'excuser", "Proposer une solution", "Agir vite", "Vérifier la satisfaction"]], ["GOU", "Décrivez la préparation d'une chambre en départ.", ["S'annoncer, aérer", "Linge sale et déchets", "Du haut vers le bas", "Salle de bain et réassort", "Contrôle final"]]], "e": ["Rédige en une page l'accueil idéal d'un client à son arrivée à l'hôtel, en français et avec trois phrases en anglais.", ["Salutation", "Vérification de la réservation", "Informations utiles", "Phrases en anglais", "Conseil sur l'île", "Formule de fin"]]}, {"t": "Le tourisme au fenua et les activités", "s": "Les visiteurs, présenter les îles, guider en sécurité, anglais niveau 2.", "f": [["Qui sont les visiteurs du fenua ?", "<ul><li>Le fenua a accueilli plus de <b>280 000 touristes internationaux en 2025</b>, un record.</li><li>Principaux marchés : <b>Amérique du Nord</b> (le premier), <b>France</b>, puis Japon, Australie, Nouvelle-Zélande, Europe.</li><li>Types de séjour : lune de miel, croisière, plongée, randonnée, séjour en <b>pension de famille</b>, visite de la famille.</li><li>Attentes : accueil chaleureux (le « mana » polynésien), propreté, ponctualité des transferts, informations claires.</li><li>Les Américains attendent beaucoup de service et d'anglais ; beaucoup de Français cherchent l'authenticité et la culture.</li><li>Le tourisme fait vivre hôtels, pensions, compagnies aériennes, prestataires d'activités, artisans, restaurants.</li></ul>"], ["Présenter le fenua avec fierté", "<ul><li><b>5 archipels</b> : Société (Tahiti, Moorea, Bora Bora…), Tuamotu, Marquises, Australes, Gambier ; 118 îles.</li><li>Culture : reo tahiti, danse (ʻori), Heiva en juillet, tatouage, pirogue (vaʻa), monoï, perle de culture, tiare.</li><li>Lieux sacrés : les <b>marae</b> se visitent avec respect (on ne monte pas sur les pierres).</li><li>Mots utiles : <b>Ia ora na</b> (bonjour), <b>Māuruuru</b> (merci), <b>Nana</b> (au revoir), <b>Maeva</b> (bienvenue).</li><li>Conseiller selon le client : plongée à Rangiroa ou Fakarava, randonnée aux Marquises, lagon à Bora Bora, marché de Papeete.</li><li>Ne jamais inventer une information : vérifier les horaires et les prix.</li></ul>"], ["Guider et encadrer une activité", "<ul><li>Avant de partir : météo, état de la mer, matériel, nombre de participants, trousse de secours, moyen d'appel.</li><li><b>Briefing</b> en français et en anglais : déroulé, consignes, gilets, comment signaler un problème.</li><li>Lagon : ne pas toucher ni marcher sur le corail, ne pas nourrir les poissons, crème solaire respectueuse, garder ses déchets.</li><li>Compter les participants au départ, pendant et au retour.</li><li>Accident : sortir la victime de l'eau, alerter (15 ; en mer : CROSS, canal 16 VHF), premiers secours.</li><li>Certaines activités demandent un diplôme (moniteur de plongée, capitaine, guide) : on n'encadre que ce qu'on a le droit d'encadrer.</li></ul>"], ["Anglais niveau 2 : renseigner et conseiller", "<ul><li><b>The restaurant is on your left / right.</b> : le restaurant est à gauche / droite.</li><li><b>The shuttle leaves at 8 am from the lobby.</b> : la navette part à 8 h du hall.</li><li><b>I recommend the lagoon tour, it's amazing.</b> : je vous conseille le tour du lagon.</li><li><b>Do you need a taxi?</b> : avez-vous besoin d'un taxi ?</li><li><b>Please don't touch the coral.</b> : merci de ne pas toucher le corail.</li><li><b>How was your day?</b> : comment s'est passée votre journée ?</li><li><b>Let me check for you.</b> : je vérifie pour vous. Phrase magique quand on ne sait pas.</li></ul>"]], "q": [["Premier marché touristique du fenua ?", ["l'Amérique du Nord", "l'Afrique", "l'Inde", "l'Amérique du Sud"], "Devant la France."], ["Combien d'archipels en Polynésie française ?", ["5", "3", "7", "12"], "Société, Tuamotu, Marquises, Australes, Gambier."], ["Le Heiva a lieu en…", ["juillet", "janvier", "mars", "octobre"], "Danse, chant, sports traditionnels."], ["« Māuruuru » signifie…", ["merci", "bonjour", "au revoir", "bienvenue"], "Ia ora na : bonjour."], ["Sur un marae, on…", ["visite avec respect sans monter sur les pierres", "pique-nique sur les pierres", "grave son nom", "déplace les pierres"], "Lieu sacré."], ["Un client demande l'horaire d'un ferry que tu ne connais pas. Tu…", ["vérifies avant de répondre", "inventes un horaire", "dis que ça n'existe pas", "l'envoies ailleurs sans aider"], "Let me check for you."], ["Avant une sortie lagon, on vérifie d'abord…", ["la météo et l'état de la mer", "la couleur du bateau", "le menu du soir", "rien"], "Puis matériel et participants."], ["On compte les participants…", ["au départ, pendant et au retour", "seulement au départ", "jamais", "une fois par semaine"], "Personne ne doit être oublié."], ["Dans le lagon, on demande aux clients de…", ["ne pas toucher ni marcher sur le corail", "ramasser du corail en souvenir", "nourrir les poissons", "jeter les déchets à l'eau"], "Le corail est vivant et fragile."], ["En mer, le canal VHF de détresse est le…", ["16", "1", "99", "112"], "On alerte aussi le 15 à terre."], ["« The shuttle leaves at 8 am from the lobby » :", ["la navette part à 8 h du hall", "le dîner est à 20 h", "la piscine ferme à 8 h", "le taxi arrive à 8 h"], "Shuttle = navette ; lobby = hall."], ["Peut-on encadrer une plongée sans diplôme de moniteur ?", ["non", "oui, si on a déjà plongé", "oui, avec des enfants", "oui, le dimanche"], "On n'encadre que ce qu'on a le droit d'encadrer."]], "c": [{"t": "Le client qui veut du corail", "s": "Pendant une sortie, un client casse un morceau de corail pour le garder en souvenir.", "o": [["Tu lui expliques calmement que le corail est vivant et protégé, tu le lui fais reposer et tu rappelles la règle à tout le groupe.", 2, "Pédagogie et respect du lagon."], ["Tu le laisses faire.", 0, "Le lagon s'abîme et les autres copient."], ["Tu le cries devant le groupe.", 1, "La règle est dite, mais le client est humilié."], ["Tu lui proposes de l'acheter.", 0, "Hors de question."]]}, {"t": "La météo qui change", "s": "Le vent se lève fortement avant une sortie en bateau avec 12 clients qui ont payé.", "o": [["Tu reportes ou adaptes la sortie en expliquant la raison de sécurité, et proposes une autre date ou un remboursement selon la règle.", 2, "La sécurité avant le chiffre d'affaires."], ["Tu pars quand même.", 0, "Risque d'accident."], ["Tu annules sans rien proposer.", 1, "Sûr, mais clients mécontents."], ["Tu demandes aux clients de voter.", 0, "La sécurité ne se vote pas."]]}], "o": [["DIR", "Présentez le fenua en deux minutes à un client qui arrive.", ["Archipels", "Culture", "Activités adaptées", "Mots en reo tahiti", "Conseils pratiques"]], ["REC", "Comment conseillez-vous une activité à un client ?", ["Écouter ses envies", "Proposer 2 choix", "Prix et horaires vérifiés", "Sécurité", "Réservation"]]], "e": ["Prépare le briefing de sécurité d'une sortie lagon, en français et en anglais.", ["Accueil", "Déroulé", "Consignes de sécurité", "Respect du corail", "En cas de problème", "Phrases en anglais"]]}, {"t": "Réservations, facture, qualité et sécurité", "s": "Réservations, encaissement, avis clients, urgences à l'hôtel.", "f": [["Réservations et tarifs", "<ul><li>Types de chambres : simple, double, twin (deux lits), suite, bungalow (jardin, plage, <b>sur pilotis</b>).</li><li>Formules : <b>chambre seule</b>, <b>petit-déjeuner</b>, <b>demi-pension</b> (petit-déjeuner + un repas), <b>pension complète</b>.</li><li><b>No-show</b> : client qui ne vient pas sans prévenir ; la politique d'annulation dit ce qui est facturé.</li><li><b>Surréservation</b> (overbooking) : plus de réservations que de chambres ; il faut reloger le client dans un hôtel équivalent, avec excuses.</li><li><b>Arrhes</b> ou acompte : somme versée à la réservation.</li><li>Vérifier : nom, dates, nombre de personnes, type de chambre, formule, demandes particulières (lit bébé, anniversaire).</li></ul>"], ["Encaisser et facturer", "<ul><li>Au départ : présenter la facture détaillée (chambre, repas, bar, activités, taxes) et laisser le client vérifier.</li><li>Les extras (minibar, restaurant) sont notés au fur et à mesure sur le compte de la chambre.</li><li>Taxes : la facture peut comporter une <b>taxe de séjour</b> et la TVA ; elles sont prévues par la réglementation.</li><li>Paiement : carte (le client tape son code), espèces (compter), virement ; remettre un reçu.</li><li>Contestation : vérifier poliment ligne par ligne, corriger si erreur, appeler le responsable si besoin.</li><li>Clôture de caisse en fin de service, comme en magasin.</li></ul>"], ["Avis clients et qualité", "<ul><li>Les clients notent l'hôtel en ligne : un avis négatif est vu par des milliers de futurs clients.</li><li>Répondre à un avis : remercier, s'excuser si besoin, expliquer ce qui a été fait, rester courtois, jamais polémiquer.</li><li>Le meilleur moyen d'éviter un mauvais avis : régler le problème <b>pendant</b> le séjour.</li><li>Petites attentions qui comptent : se souvenir d'un prénom, d'un anniversaire, d'une préférence.</li><li>Les standards de l'hôtel (temps de réponse, présentation, propreté) sont contrôlés : les respecter même quand personne ne regarde.</li></ul>"], ["Sécurité et urgences à l'hôtel", "<ul><li><b>Incendie</b> : donner l'alerte, évacuer selon le plan, ne pas prendre l'ascenseur, guider les clients au point de rassemblement, compter.</li><li><b>Malaise d'un client</b> : appeler le <b>15</b>, rester avec lui, envoyer quelqu'un chercher le défibrillateur s'il y en a un.</li><li><b>Piscine et plage</b> : surveiller les enfants, connaître le numéro d'urgence et le matériel de secours.</li><li><b>Cyclone ou tsunami</b> : suivre les consignes de la direction et des autorités (haut-commissariat, mairie), connaître les zones de repli en hauteur.</li><li>Clés et badges : jamais remis sans vérifier l'identité.</li><li>Objet ou bagage suspect : ne pas toucher, prévenir le responsable.</li></ul>"]], "q": [["La demi-pension comprend…", ["le petit-déjeuner et un repas", "seulement la chambre", "tous les repas et les boissons", "le petit-déjeuner seulement"], "Pension complète : 3 repas."], ["Un no-show est…", ["un client qui ne vient pas sans prévenir", "un client en retard de 5 minutes", "une chambre sale", "un spectacle annulé"], "La politique d'annulation s'applique."], ["En cas de surréservation, on…", ["reloge le client dans un hôtel équivalent avec excuses", "le renvoie", "le fait dormir dans le hall", "annule sans rien proposer"], "Le client n'y est pour rien."], ["Un bungalow sur pilotis est…", ["construit au-dessus du lagon", "dans le jardin", "au sous-sol", "une tente"], "Très demandé à Bora Bora."], ["Les extras du minibar sont…", ["notés sur le compte de la chambre", "gratuits toujours", "payés par le personnel", "oubliés"], "Facturés au départ."], ["Un client conteste une ligne de sa facture. Tu…", ["vérifies poliment et corriges si c'est une erreur", "refuses de discuter", "enlèves tout", "appelles la police"], "Vérifier ligne par ligne."], ["Pour répondre à un avis négatif en ligne, on…", ["remercie, s'excuse si besoin et explique ce qui a été fait", "insulte le client", "supprime l'avis", "ne répond jamais"], "Courtoisie et action."], ["Le meilleur moyen d'éviter un mauvais avis est…", ["régler le problème pendant le séjour", "offrir des cadeaux à tous", "interdire les téléphones", "ne rien faire"], "Agir tout de suite."], ["En cas d'incendie, on ne prend pas…", ["l'ascenseur", "l'escalier", "la sortie de secours", "le point de rassemblement"], "Risque d'être bloqué."], ["Un client fait un malaise au restaurant. Tu…", ["appelles le 15 et restes avec lui", "attends qu'il aille mieux", "le mets dans sa chambre", "continues le service"], "Et fais chercher le défibrillateur."], ["Alerte tsunami : on suit…", ["les consignes de la direction et des autorités, zones en hauteur", "les rumeurs", "les clients", "rien"], "Connaître les zones de repli."], ["Un inconnu demande la clé de la chambre 12. Tu…", ["vérifies son identité avant", "la donnes", "la jettes", "lui donnes un double"], "Sécurité des clients."]], "c": [{"t": "La surréservation", "s": "Il reste une chambre et deux clients se présentent avec la même réservation confirmée.", "o": [["Tu installes l'un, trouves pour l'autre un hôtel équivalent, organises et paies le transfert selon la règle de l'hôtel, avec excuses et attention.", 2, "Solution digne et rapide."], ["Tu dis au second de se débrouiller.", 0, "Client abandonné, mauvais avis assuré."], ["Tu les fais partager la chambre.", 0, "Inacceptable."], ["Tu appelles ta responsable sans rien dire aux clients.", 1, "Bon réflexe, mais informe-les."]]}, {"t": "La facture contestée", "s": "Au départ, un client refuse de payer trois consommations au bar qu'il dit ne pas avoir prises.", "o": [["Tu vérifies les tickets signés et l'heure, et s'il y a doute ou erreur, tu le retires avec l'accord du responsable.", 2, "Vérification et décision juste."], ["Tu refuses de discuter.", 0, "Conflit."], ["Tu retires tout sans vérifier.", 1, "Client content, mais perte possible."], ["Tu l'accuses de mentir.", 0, "Jamais."]]}], "o": [["REC", "Expliquez les différentes formules et la politique function atelier(n,done,back){const A=AT[n],D=dif(),tmax=D===2?60:D===1?120:0;let i=0,pts=0;AUSRC=null;
  const fmtn=v=>String(v).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g," ");
  (function show(){halt();const Q=A.it[i];window.scrollTo(0,0);
    app.innerHTML=hdr(`Atelier · ${i+1}/${A.it.length}`)+`<div class="card"><span class="tag">${A.t}</span><p class="q">${Q.q}</p>${tmax?`<div class="timer" id="tmr" style="font-size:22px"></div>`:""}<div id="zone"></div><div id="fb"></div></div>`;
    bindBack(back);const z=document.getElementById("zone"),fb=document.getElementById("fb");
    const fin=(sc,msg)=>{halt();pts+=sc;z.querySelectorAll("button,input").forEach(x=>x.disabled=true);
      fb.innerHTML=`<div class="fb" style="border-color:${sc===1?"var(--ok)":sc>0?"var(--gold)":"var(--ko)"}"><b>${msg}</b> ${Q.x}</div><button class="btn" id="nx">${i<A.it.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<A.it.length?show():done(Math.round(pts/A.it.length*100))}};
    if(typeof XK!=="undefined"&&XK[Q.k]){XK[Q.k](Q,z,fin);return}
    if(Q.k==="num"){z.innerHTML=`<div class="row"><input id="ans" type="text" inputmode="decimal" placeholder="Ta réponse" style="flex:2;padding:13px;border-radius:11px;border:1.5px solid var(--line);font:inherit;background:var(--bg);color:var(--ink)"><span style="flex:0 0 auto;font-weight:700">${Q.u}</span></div><button class="btn" id="val">Valider</button>`;
      const check=()=>{const raw=document.getElementById("ans").value.replace(/\s/g,"").replace(",",".");const v=parseFloat(raw);if(isNaN(v))return toast("Entre un nombre.");const ok=Math.abs(v-Q.a)<=Q.tol+1e-9;fin(ok?1:0,ok?"Exact.":`La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`)};
      document.getElementById("val").onclick=check;document.getElementById("ans").onkeydown=e=>{if(e.key==="Enter")check()};

function simu(done,back){const st=Object.assign({},SIMCFG.st),fl={},log=[],D=dif(),mult=D===2?1.5:D===1?1.25:1,tmax=D===2?40:D===1?75:0;let i=0;
  const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
  const bars=()=>D===2?`<p class="mut">Mode expert : indicateurs masqués jusqu'au bilan.</p>`:Object.keys(IND).map(k=>`<div style="display:flex;gap:8px;align-items:center;font-size:13px"><span style="flex:0 0 150px">${IND[k]}</span><div class="bar" style="flex:1;margin:3px 0"><i style="width:${st[k]}%;background:${st[k]<40?"var(--ko)":st[k]<60?"var(--gold)":"var(--ok)"}"></i></div></div>`).join("");

  bindBack(back);document.getElementById("go").onclick=next;
  function next(){halt();while(i<EV.length&&EV[i].when&&!EV[i].when(fl))i++;if(i>=EV.length)return bilan();const E=EV[i],o=shuf(E.o.map((x,k)=>[x,k]));window.scrollTo(0,0);
    app.innerHTML=hdr(E.j)+`<div class="card">${bars()}</div><div class="card"><h2 style="margin-top:0">${E.t}</h2><p>${E.s}</p>${tmax?`<div class="timer" id="tmr"></div>`:""}${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0][0]}</button>`).join("")}<div id="fb"></div></div>`;
    bindBack(back);
    const pick=j=>{halt();const opt=j<0?["Aucune décision prise à temps.",SIMCFG.none,[],"Ne pas décider est une décision : la situation s'est dégradée sans toi."]:o[j][0];
      Object.entries(opt[1]).forEach(([k,v])=>st[k]=clamp(st[k]+(v<0?v*mult:v)));opt[2].forEach(f=>fl[f]=1);
      const best=Math.max(...E.o.map(x=>Object.values(x[1]).reduce((s,v)=>s+v,0)));const mine=Object.values(opt[1]).reduce((s,v)=>s+v,0);

</b> (long, à couvert), <b>frire</b>, <b>à la vapeur</b>.</li><li>Cuisson à cœur : volailles et viandes hachées bien cuites ; thermomètre à sonde si besoin.</li><li><b>Fiche technique</b> : ingrédients, quantités pour X portions, étapes, temps, photo du dressage, <b>coût</b>.</li><li><b>Coût matière par portion</b> = coût total des ingrédients ÷ nombre de portions.</li><li>Repère souvent utilisé : le coût matière représente environ 25 à 35 % du prix de vente hors taxe.</li></ul>"], ["Produits et plats du fenua", "<ul><li><b>Poisson cru au lait de coco</b> (thon, citron, légumes, lait de coco frais).</li><li><b>Ma'a Tahiti</b> : cuisson au four tahitien (ahima'a) ; fafaru, poulet fafa, po'e, uru (fruit de l'arbre à pain), taro, fe'i.</li><li>Produits locaux : thon, mahi-mahi, vanille de Tahaa, coco, ananas de Moorea, pamplemousse, citron vert.</li><li>Valoriser le local : fraîcheur, moins de transport, fierté des clients.</li><li>Allergènes à surveiller dans la cuisine locale : poisson, crustacés, lait de coco (rare), arachides dans certaines sauces.</li></ul>"]], "q": [["Qui remplace le chef en son absence ?", ["le second", "le plongeur", "le commis", "le serveur"], "Le second de cuisine."], ["Le garde-manger s'occupe…", ["des préparations froides", "des desserts", "de la vaisselle", "de la caisse"], "Entrées froides, découpes."], ["Quand le chef annonce un bon, on répond…", ["« Oui chef ! »", "rien", "« Pas moi »", "« Plus tard »"], "Pour confirmer qu'on a entendu."], ["La mise en place se fait…", ["avant le service", "après le service", "pendant la pause", "jamais"], "Tout prêt avant les clients."], ["La brunoise, ce sont…", ["des petits dés", "de longs bâtonnets", "de gros morceaux", "des tranches"], "Julienne : bâtonnets fins."], ["Pocher, c'est cuire…", ["dans un liquide frémissant", "à la poêle très chaude", "au four sec", "dans l'huile"], "Œufs, poissons, fruits."], ["Braiser, c'est cuire…", ["longtemps, à couvert, avec un peu de liquide", "très vite à feu vi   <div class="card hero">${n<NS?`<small>Séance ${n+1} sur ${NS} · Niveau ${l+1}</small><h2 style="margin:4px 0">${L[l].t}</h2><small>${DAYN[d]} · environ ${plan(l,d).reduce((s,x)=>s+x.m,0)} min</small><button class="btn wh" id="goDay">Commencer la séance</button>`:`<h2 style="margin:4px 0">Parcours terminé 🎉</h2><small>Continue avec les révisions, les ateliers et les entretiens.</small>`}</div>

  <div class="tiles">
   <button class="tile" id="rev"${S.w.length?"":" hidden"}><span>🔁</span><b>Réviser</b><small>${S.w.length} erreur${S.w.length>1?"s":""} à revoir</small></button>
   <button class="tile" id="cs"><span>🎙️</span><b>Recruteur</b><small>Questions d'entretien</small></button>

  <div class="card warn"><h3>À savoir</h3><p class="mut">Ce parcours prépare au métier et à l'entretien d'embauche. Il ne remplace ni la formation, ni les habilitations, ni les consignes de l'employeur.</p></div>`;
  const g=document.getElementById("goDay");if(g)g.onclick=()=>go("day",l,d);
  document.getElementById("rev").onclick=()=>{const it=mix(10,L.length-1);quiz(it,"Révision",sc=>{gain("",sc);go("home")},()=>go("home"))};
  document.getElementById("cs").onclick=()=>go("conseil");document.getElementById("exb").onclick=()=>go("exam");document.getElementById("smb").onclick=simHub;document.getElementById("inst").onclick=installApp}
function parcours(){const cur=curDay();
  app.innerHTML=`<h1>Parcours</h1><p class="mut">${L.length} niveaux · ${NS} séances courtes de 12 à 15 minutes. À 5 séances par semaine : ${L.length} semaines ; tous les jours : environ ${Math.ceil(NS/7)}.</p>`+L.map((x,l)=>`<div class="card"><div class="lvl"><div class="num">${l+1}</div><div style="flex:1"><h3>${x.t}</h3><small>${x.s}</small><div class="days">${DAYN.map((n,d)=>{const i=l*5+d,dn=dayDone(l,d),lk=!S.free&&i>cur;return `<button class="day ${dn?"done":i===cur?"cur":lk?"lock":""}" data-l="${l}" data-d="${d}" ${lk?"disabled":""}>${dn?"✓":n}</button>`}).join("")}</div></div></div></div>`).join("");
  app.querySelectorAll(".day").forEach(b=>b.onclick=()=>go("day",+b.dataset.l,+b.dataset.d))}
function day(l,d){const P=plan(l,d);
  app.innerHTML=hdr(`Niveau ${l+1} · ${DAYN[d]}`)+`<h2>${L[l].t}</h2><p class="mut">Environ ${P.reduce((s,x)=>s+x.m,0)} minutes. Fais les étapes dans l'ordre.</p>`+P.map((p,i)=>{const k=sk(l,d,i),dn=k in S.s;return `<button class="step ${dn?"done":""}" data-i="${i}"><span class="ic">${LBL[p.k][0]}</span><span><b>${p.n||LBL[p.k][1]}</b><br><small>${p.m} min</small></span>${dn?`<span class="sc">${S.s[k]}%</span>`:""}</button>`}).join("")+(dayDone(l,d)?`<div class="card" style="text-align:center"><b>Séance validée ✓</b></div>`:"");
  bindBack(()=>go("parcours"));
  app.querySelectorAll(".step").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,p=P[i],k=sk(l,d,i),back=()=>go("day",l,d),fin=sc=>end(k,sc,back);
    if(p.k==="lire")lire(l,p.f,fin,back);else if(p.k==="quiz")quiz(p.q(),p.n||"Quiz",fin,back);else if(p.k==="cas")cas(l,p.c,fin,back);else if(p.k==="oral")oral(p.o.map(o=>[l,o]),fin,back);else if(p.k==="sim"){const m=SIMMAP[l];m==="dil"?dilem(fin,back):m==="simu"?simu(fin,back):atelier(+m.slice(2),fin,back)}else ecrit(l,fin,back)})}
function end(key,score,back){halt();const xp=gain(key,score);
  app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">${score>=80?"🌺":score>=50?"🌿":"🌱"}</div><h2>${score}%</h2><p>+${xp} points</p><p class="mut">${score>=80?"Très solide.":score>=50?"C'est en bonne voie, les erreurs reviendront en révision.":"À retravailler : relis les fiches puis recommence."}</p><button class="btn" id="ok">Continuer</button></div>`;
  document.getElementById("ok").onclick=back}

/* ---------- Activités ---------- */
function lire(l,fs,done,back){let i=0;(function show(){hush();const f=L[l].f[fs[i]];window.scrollTo(0,0);
  app.innerHTML=hdr(`Fiche ${i+1}/${fs.length}`)+`<div class="card fiche"><h2 style="margin-top:0">${f[0]}</h2>${f[1]}</div><button class="btn" id="nx">${i<fs.length-1?"Fiche suivante":"J'ai lu et compris"}</button>`;
  bindBack(back);document.getElementById("nx").onclick=()=>{i++;i<fs.length?show():done(100)}})()}
function quiz(items,title,done,back){AUSRC=null;let i=0,ok=0;if(!items.length)return done(100);(function show(){const [l,k]=items[i],Q=L[l].q[k],o=shuf(Q[1].map((t,j)=>[t,j===0]));hush();window.scrollTo(0,0);
  app.innerHTML=hdr(`${title} · ${i+1}/${items.length}`)+`<div class="card"><span class="tag">Niveau ${l+1}</span><p class="q">${Q[0]}</p>${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0]}</button>`).join("")}<div id="fb"></div></div>`;
  bindBack(back);const bs=app.querySelectorAll(".opt");
    if(dif()>0){const tb=document.createElement("div");tb.className="timer";tb.style.fontSize="22px";app.querySelector(".card").prepend(tb);count(dif()===2?25:45,tb,()=>{const k2=l+"."+k;if(!S.w.includes(k2))S.w.push(k2);save();bs.forEach((x,m)=>{x.disabled=true;if(o[m][1])x.classList.add("good")});document.getElementById("fb").innerHTML=`<div class="fb"><b>Temps écoulé.</b> ${Q[2]}</div><button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;document.getElementById("nx").onclick=()=>{i++;i<items.length?show():done(Math.round(ok/items.length*100))}})}
    bs.forEach((b,j)=>b.onclick=()=>{halt();const good=o[j][1],key=l+"."+k;bs.forEach((x,m)=>{x.disabled=true;if(o[m][1])x.classList.add("good")});
    if(good){ok++;S.w=S.w.filter(z=>z!==key)}else{b.classList.add("bad");if(!S.w.includes(key))S.w.push(key)}save();
    document.getElementById("fb").innerHTML=`<div class="fb"><b>${good?"Exact.":"Pas tout à fait."}</b> ${Q[2]}</div><button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;
    document.getElementById("nx").onclick=()=>{i++;i<items.length?show():done(Math.round(ok/items.length*100))}})})()}
function cas(l,cs,done,back){AUSRC=null;let i=0,pts=0;(function show(){const C=L[l].c[cs[i]],o=shuf(C.o);hush();window.scrollTo(0,0);
  app.innerHTML=hdr(`Situation ${i+1}/${cs.length}`)+`<div class="card"><h2 style="margin-top:0">${C.t}</h2><p>${C.s}</p><p class="mut">Que fais-tu ?</p>${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0]}</button>`).join("")}<div id="fb"></div></div>`;
  bindBack(back);const bs=app.querySelectorAll(".opt");bs.forEach((b,j)=>b.onclick=()=>{pts+=o[j][1];bs.forEach((x,m)=>{x.disabled=true;{const c=o[m][1]===2?"good":o[m][1]===0?"bad":"";if(c)x.classList.add(c)};x.innerHTML+=`<br><small>${["✗","≈","✓"][o[m][1]]} ${o[m][2]}</small>`});b.style.outline="3px solid var(--gold)";
    document.getElementById("fb").innerHTML=`<button class="btn" id="nx">${i<cs.length-1?"Situation suivante":"Terminer"}</button>`;
    document.getElementById("nx").onclick=()=>{i++;i<cs.length?show():done(Math.round(pts/(cs.length*2)*100))}})})()}
function timerBox(sec){return `<div class="timer" id="tmr">${fmt(sec)}</div><div class="row"><button class="btn sec" id="tgo" style="margin:0">Démarrer le chrono</button></div>`}
const fmt=s=>(s>=3600?Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0"):Math.floor(s/60))+":"+String(s%60).padStart(2,"0");
function bindTimer(sec){let left=sec;const el=document.getElementById("tmr"),b=document.getElementById("tgo");b.onclick=()=>{if(tm){halt();b.textContent="Reprendre";return}b.textContent="Pause";tm=setInterval(()=>{left--;el.textContent=fmt(Math.max(0,left));if(left<=0){halt();el.textContent="Temps écoulé";b.disabled=true}},1000)}}
function oral(list,done,back){AUSRC=null;let i=0,tot=0;(function show(){const [l,k]=list[i],O=L[l].o[k],j=J[O[0]];halt();window.scrollTo(0,0);
  app.innerHTML=hdr(`Le jury · ${i+1}/${list.length}`)+`<div class="card"><div class="jur"><div class="av" style="background:${j.c}">${j.n.split(" ").pop()[0]}</div><div><b>${j.n}</b><br><small>${j.r}</small></div></div><p class="q">« ${O[1]} »</p><p class="mut">Prends une minute pour réfléchir, puis réponds <b>à voix haute</b> pendant trois minutes, comme face au recruteur.</p>${timerBox(240)}<p class="mut" style="margin-top:12px">Notes (facultatif)</p><textarea id="nt" placeholder="Mots-clés de ta réponse…"></textarea><button class="btn" id="rv">Voir ce que le recruteur attend</button><div id="fb"></div></div>`;
  bindBack(back);bindTimer(240);document.getElementById("rv").onclick=e=>{halt();e.target.remove();
    document.getElementById("fb").innerHTML=`<div class="fb"><b>Coche ce que tu as vraiment dit :</b></div>${O[2].map((x,m)=>`<label class="ck"><input type="checkbox" data-m="${m}"><span>${x}</span></label>`).join("")}<button class="btn" id="nx">Valider</button>`;
    document.getElementById("nx").onclick=()=>{tot+=app.querySelectorAll("input:checked").length/O[2].length;i++;i<list.length?show():done(Math.round(tot/list.length*100))}}})()}
function ecrit(l,done,back,E){AUSRC=null;E=E||L[l].e;window.scrollTo(0,0);
  app.innerHTML=hdr("Écrit")+`<div class="card"><span class="tag">Sujet</span><p class="q">${E[0]}</p><p class="mut">30 minutes : une réponse rédigée, claire et structurée, comme une note professionnelle. Sur papier ou ci-dessous.</p><p><b>Pistes</b></p><ul>${E[1].map(x=>`<li>${x}</li>`).join("")}</ul>${timerBox(1800)}<textarea id="tx" style="min-height:220px;margin-top:12px" placeholder="Ta copie…"></textarea><button class="btn" id="rv">J'ai fini : m'auto-évaluer</button><div id="fb"></div></div>`;
  bindBack(back);bindTimer(1800);const tx=document.getElementById("tx");tx.value=S.txt[l]||"";tx.oninput=()=>{S.txt[l]=tx.value;save()};
  document.getElementById("rv").onclick=e=>{halt();e.target.remove();document.getElementById("fb").innerHTML=`<div class="fb"><b>Grille de relecture :</b> coche ce qui est réussi.</div>${GRILLE.map(x=>`<label class="ck"><input type="checkbox"><span>${x}</span></label>`).join("")}<button class="btn" id="nx">Valider</button>`;
    document.getElementById("nx").onclick=()=>done(Math.round(app.querySelectorAll("input:checked").length/GRILLE.length*100))}}
function fiches(){app.innerHTML=`<h1>Fiches</h1><p class="mut">Tout le cours, à relire quand tu veux.</p><button class="btn sec" id="rep">📌 Aide-mémoire : les repères à connaître</button>`+L.map((x,l)=>`<div class="card"><h3>${l+1}. ${x.t}</h3>${x.f.map((f,i)=>`<button class="opt" data-l="${l}" data-i="${i}">${f[0]}</button>`).join("")}</div>`).join("");
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>lire(+b.dataset.l,[+b.dataset.i],()=>go("fiches"),()=>go("fiches")));document.getElementById("rep").onclick=reperes}
function conseil(){app.innerHTML=`<h1>Les recruteurs</h1><p class="mut">Ton panel de recruteurs d'entraînement (personnages fictifs). Choisis qui t'interroge, ou laisse le hasard décider.</p>`+Object.keys(J).map(k=>`<button class="step" data-k="${k}"><span class="av" style="background:${J[k].c};flex:0 0 40px;height:40px">${J[k].n.split(" ").pop()[0]}</span><span><b>${J[k].n}</b><br><small>${J[k].r}</small></span></button>`).join("")+`<button class="btn" id="all">Entretien complet : 4 questions</button>`;
  const pick=(k,n)=>{const p=[];L.forEach((x,l)=>x.o.forEach((o,i)=>{if(!k||o[0]===k)p.push([l,i])}));return shuf(p).slice(0,n)};
  const run=list=>oral(list,sc=>end("",sc,()=>go("conseil")),()=>go("conseil"));
  app.querySelectorAll(".step").forEach(b=>b.onclick=()=>run(pick(b.dataset.k,2)));
  document.getElementById("all").onclick=()=>run(Object.keys(J).map(k=>pick(k,1)[0]))}
/* ---------- Conditions réelles ---------- */
function say(t){if(!TTS)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.97;const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function count(sec,el,onEnd){let left=sec;el.textContent=fmt(left);if(tm)clearInterval(tm);tm=setInterval(()=>{left--;el.textContent=fmt(Math.max(0,left));if(left<=0){clearInterval(tm);tm=null;onEnd()}},1000)}
function note20(title,n,back){S.ex.unshift([today(),title,n]);S.ex=S.ex.slice(0,30);end("",Math.round(n*5),back)}
function exam(){app.innerHTML=`<h1>Simulation d'embauche</h1><p class="mut">Chrono sans pause, aucune correction avant la fin.</p>
  <button class="step" id="e1"><span class="ic">🎙️</span><span><b>Entretien d'embauche en restauration</b><br><small>20 min : 5 min de présentation, puis questions et relances</small></span></button>
  <button class="step" id="e4"><span class="ic">✅</span><span><b>Test de connaissances</b><br><small>30 questions en 20 min, correction à la fin</small></span></button>
  <button class="btn sec" id="e6">Ateliers et dilemmes</button>
  <button class="btn sec" id="e5">Entraînement libre avec le recruteur</button>
  <div class="card"><h3>Mes résultats</h3>${S.ex.length?S.ex.map(x=>`<p style="display:flex;justify-content:space-between"><span>${x[0]} · ${x[1]}</span><b>${x[2]}/20</b></p>`).join(""):`<p class="mut">Aucune simulation passée pour l'instant.</p>`}</div>
  <div class="card warn"><h3>Ce que le jeu ne remplace pas</h3><p class="mut">L'hygiène et les gestes se pratiquent : demande une formation hygiène alimentaire.</p></div>`;
  const pool=()=>{const p=X.slice();L.forEach(x=>x.o.forEach(o=>p.push(o)));return p};
  document.getElementById("e1").onclick=()=>examOral({t:"Entretien restauration",expo:5,total:20,pool});
  document.getElementById("e4").onclick=examQCM;document.getElementById("e5").onclick=()=>go("conseil");document.getElementById("e6").onclick=simHub}
function examOral(o){AUSRC=null;const back=()=>go("exam"),asked=[];
  app.innerHTML=hdr(o.t)+`<div class="card fiche"><h2 style="margin-top:0">Déroulement</h2><ul><li><b>${o.expo} minutes</b> d'exposé : ton parcours et ton projet. À la fin du temps, le recruteur te coupe.</li><li>Puis des questions jusqu'à <b>${o.total} minutes</b> au total, sans préparation, avec des relances.</li><li>Réponds <b>à voix haute</b>. Tu ne verras les attendus qu'au débriefing.</li><li>Aucune pause. Quitter l'écran annule l'épreuve.</li></ul><label class="ck" style="border:0"><input type="checkbox" id="vx" ${TTS?"checked":"disabled"}><span>Le recruteur pose ses questions à voix haute${TTS?"":" (indisponible sur cet appareil)"}</span></label><button class="btn" id="st">Entrer dans la salle</button></div>`;
  bindBack(back);document.getElementById("st").onclick=()=>p1(document.getElementById("vx").checked);
  function p1(voice){const line=`Bonjour. Installez-vous. Vous avez ${o.expo} minutes pour vous présenter, nous vous écoutons.`,t0=Date.now();window.scrollTo(0,0);
    app.innerHTML=`<div class="card"><span class="tag">Exposé</span><p class="q">« ${line} »</p><div class="timer" id="tmr"></div><p class="mut">Regarde l'écran comme tu regarderais le recruteur. Ne lis pas tes notes.</p><button class="btn" id="nx">J'ai terminé mon exposé</button></div>`;
    if(voice)say(line);const nx=cut=>{clearInterval(tm);tm=null;p2(voice,cut,Math.round((Date.now()-t0)/1000))};
    count(o.expo*60,document.getElementById("tmr"),()=>nx(true));document.getElementById("nx").onclick=()=>nx(false)}
  function p2(voice,cut,used){const qs=shuf(o.pool()).slice(0,16);let i=-1,rel=false,over=false;window.scrollTo(0,0);
    const fin=()=>{if(over)return;over=true;clearInterval(tm);tm=null;hush();debrief(cut,used)};
    app.innerHTML=`<div class="card"><span class="tag">Entretien</span><div class="timer" id="tmr"></div><div id="qz"></div><button class="btn" id="nx">J'ai répondu : question suivante</button></div>`;
    count(Math.max(60,o.total*60-used),document.getElementById("tmr"),fin);
    const put=(q,txt,pre)=>{const j=J[q[0]];document.getElementById("qz").innerHTML=`<div class="jur"><div class="av" style="background:${j.c}">${j.n.split(" ").pop()[0]}</div><div><b>${j.n}</b><br><small>${j.r}</small></div></div><p class="q">« ${pre||""}${txt} »</p>`;if(voice)say((pre||"")+txt)};
    const nxt=()=>{if(!rel&&i>=0&&Math.random()<.35){rel=true;put(qs[i],RELANCES[Math.floor(Math.random()*RELANCES.length)])}else{rel=false;i++;if(i>=qs.length)return fin();asked.push(qs[i]);put(qs[i],qs[i][1],i===0&&cut?"Je vous interromps, le temps de l'exposé est écoulé. ":"")}};
    document.getElementById("nx").onclick=nxt;nxt()}
  function debrief(cut,used){const tgt=o.expo*60,msg=cut?"interrompu par le recruteur : exposé trop long ou mal minuté":used<tgt*.6?"nettement trop court : tu laisses du temps aux questions difficiles":"durée correcte";window.scrollTo(0,0);
    app.innerHTML=hdr("Débriefing")+`<div class="card"><p><b>Exposé : ${fmt(used)}</b> sur ${o.expo}:00, ${msg}.</p><p><b>${asked.length} questions</b> traitées. Ouvre chacune et compare avec ce que tu as réellement dit.</p></div>`+asked.map(q=>`<details class="card"><summary><b>${J[q[0]].n} :</b> ${q[1]}</summary><ul>${q[2].map(k=>`<li>${k}</li>`).join("")}</ul></details>`).join("")+`<div class="card"><h3>Grille du recruteur</h3><p class="mut">Note-toi comme un recruteur le ferait : 0 = absent, 2 = moyen, 4 = excellent.</p>${CRIT.map(c=>`<label class="ck"><span style="flex:1">${c}</span><select>${[0,1,2,3,4].map(n=>`<option ${n===2?"selected":""}>${n}</option>`).join("")}</select></label>`).join("")}<button class="btn" id="ok">Calculer ma note</button></div>`;
    bindBack(back);document.getElementById("ok").onclick=()=>{let n=0;app.querySelectorAll("select").forEach(x=>n+=+x.value);note20(o.t,n,back)}}}
function examQCM(){AUSRC=null;const back=()=>go("exam"),pool=[];L.forEach((x,l)=>x.q.forEach((_,k)=>pool.push([l,k])));const items=shuf(pool).slice(0,30),res=[];let i=0,over=false;
  app.innerHTML=hdr("QCM · 30 questions")+`<div class="timer" id="tmr"></div><div id="qz"></div>`;bindBack(back);
  const fin=()=>{if(over)return;over=true;clearInterval(tm);tm=null;const ok=res.filter(r=>r[2]).length,n=Math.round(ok/items.length*40)/2,ko=res.filter(r=>!r[2]);window.scrollTo(0,0);
    app.innerHTML=hdr("Correction")+`<div class="card" style="text-align:center"><h2>${n}/20</h2><p>${ok} bonnes réponses sur ${items.length}${res.length<items.length?` · ${items.length-res.length} non traitées`:""}</p><button class="btn" id="ok">Enregistrer</button></div>`+ko.map(r=>{const Q=L[r[0]].q[r[1]];return `<div class="card"><p class="q">${Q[0]}</p><p>✓ ${Q[1][0]}</p><p class="mut">Ta réponse : ${r[3]}</p><div class="fb">${Q[2]}</div></div>`}).join("");
    bindBack(back);ko.forEach(r=>{const k=r[0]+"."+r[1];if(!S.w.includes(k))S.w.push(k)});document.getElementById("ok").onclick=()=>note20("QCM",n,back)};
  count(1200,document.getElementById("tmr"),fin);

u prix en caisse. Tu…", ["préviens le responsable et appliques la procédure", "ne dis rien", "inventes un prix", "enlèves l'étiquette"], "Information juste du client."], ["Première étape de la vente ?", ["saluer le client", "annoncer le prix", "conclure", "parler de soi"], "Puis découvrir le besoin."], ["CAP en vente signifie…", ["Caractéristique, Avantage, Preuve", "Client, Achat, Paiement", "Caisse, Accueil, Prix", "Conseil, Attente, Promotion"], "Un argument clair."], ["Un client devient agressif. Tu…", ["gardes ta distance, restes calme et appelles un responsable", "cries plus fort", "le pousses dehors", "l'ignores"], "Sécurité d'abord."]], "c": [{"t": "Le client pressé", "s": "Une longue file, un client conteste : « Je vous ai donné 10 000 F, pas 5 000 F ! »", "o": [["Tu restes calme, montres le billet posé à part et proposes de recompter la caisse avec le responsable.", 2, "Procédure claire, pas de dispute."], ["Tu lui rends 5 000 F de plus pour avancer.", 0, "Écart de caisse probable."], ["Tu le traites de menteur.", 0, "Conflit."], ["Tu appelles le responsable sans rien expliquer.", 1, "Bien, mais explique au client."]]}, {"t": "Le produit périmé", "s": "En rayon, tu trouves cinq yaourts dont la date est dépassée.", "o": [["Tu les retires, les déclares au chef de rayon et vérifies le reste du lot.", 2, "Sécurité et suivi."], ["Tu les mets au fond du rayon.", 0, "Un client peut les acheter."], ["Tu les manges.", 0, "Vol et risque."], ["Tu les retires sans rien dire.", 1, "Le stock et les commandes restent faux."]]}], "o": [["CAI", "Comment rendez-vous la monnaie sans erreur ?", ["Annoncer la somme reçue", "Billet à part", "Compter à partir du prix", "Vérifier", "Remercier"]], ["VEN", "Présentez les étapes d'une vente.", ["Saluer", "Découvrir le besoin", "Avantages", "Objections", "Conclure"]]], "e": ["Explique en une page à un nouveau collègue comment tenir sa caisse du début à la fin de la journée.", ["Fond de caisse", "Encaissement", "Monnaie", "Carte bancaire", "Clôture", "Écart"]]}, {"t": "Vente conseil et fidélisation", "s": "Découvrir le besoin, argumenter, objections, vente additionnelle, fidélité, téléphone et réseaux.", "f": [["Découvrir le besoin", "<ul><li>Questions <b>ouvertes</b> : « Pour quel usage ? », « Qu'est-ce qui compte le plus pour vous ? »</li><li>Méthode <b>SONCAS</b> : Sécurité, Orgueil, Nouveauté, Confort, Argent, Sympathie : les grandes motivations d'achat.</li><li>Écouter plus que parler ; reformuler (« Si je comprends bien, vous voulez… »).</li><li>Observer : le client compare les prix ? Il cherche la qualité ? Il est pressé ?</li><li>Un bon vendeur vend ce dont le client a besoin, pas ce qui l'arrange.</li></ul>"], ["Argumenter et répondre aux objections", "<ul><li>Argument <b>CAP</b> : Caractéristique (ce que c'est), Avantage (ce que ça apporte), Preuve (démonstration, avis, garantie).</li><li>Relier l'argument à la motivation du client : « Vous voulez être tranquille ? Il est garanti 2 ans. »</li><li><b>Objection</b> (« c'est trop cher ») : écouter, reformuler, répondre (qualité, durée, économies), proposer une alternative.</li><li>Ne jamais dénigrer un concurrent.</li><li><b>Conclure</b> : proposer clairement (« Je vous le prépare ? »), puis remercier.</li></ul>"], ["Vente additionnelle et fidélisation", "<ul><li><b>Vente additionnelle</b> : proposer un produit complémentaire utile (piles avec le jouet, housse avec le téléphone).</li><li><b>Montée en gamme</b> : proposer un modèle supérieur si cela répond mieux au besoin.</li><li><b>Fidéliser</b> : carte de fidélité, se souvenir du client, service après-vente, suivi.</li><li>Un client satisfait revient et en parle autour de lui ; au fenua, le bouche-à-oreille compte énormément.</li><li>Ne jamais forcer : un client piégé ne revient pas.</li></ul>"], ["Téléphone, messages et réseaux sociaux", "<ul><li>Beaucoup de clients au fenua demandent par Facebook ou Messenger : répondre vite, poliment, avec le prix et la disponibilité.</li><li>Au téléphone : se présenter, écouter, noter la demande, rappeler si besoin.</li><li>Photos de produits claires, prix affichés, horaires à jour.</li><li>Réclamation publique sur les réseaux : répondre calmement et proposer d'en parler en message privé.</li><li>Ne jamais publier une photo de client sans son accord.</li></ul>"]], "q": [["Une question ouverte…", ["invite le client à expliquer son besoin", "attend oui ou non", "parle du prix seulement", "ferme la discussion"], "« Pour quel usage ? »"], ["Dans SONCAS, le C signifie…", ["Confort", "Client", "Caisse", "Crédit"], "Sécurité, Orgueil, Nouveauté, Confort, Argent, Sympathie."], ["Un bon vendeur vend…", ["ce dont le client a besoin", "ce qui rapporte le plus au vendeur", "n'importe quoi", "ce qui encombre le stock"], "Sinon le client ne revient pas."], ["CAP signifie…", ["Caractéristique, Avantage, Preuve", "Client, Achat, Paiement", "Conseil, Accueil, Prix", "Caisse, Article, Promotion"], "Un argument complet."], ["Le client dit « c'est trop cher ». Tu…", ["écoutes, reformules et montres la valeur ou une alternative", "baisses tout de suite le prix", "le laisses partir", "te fâches"], "Traiter l'objection."], ["Dénigrer un concurrent est…", ["à éviter toujours", "une bonne technique", "obligatoire", "conseillé le samedi"], "Ça donne une mauvaise image."], ["Proposer des piles avec un jouet, c'est…", ["de la vente additionnelle", "une faute", "de la fidélisation seulement", "un mensonge"], "Complément utile."], ["La fidélisation vise à…", ["faire revenir le client", "vendre une seule fois", "faire peur au client", "éviter le client"], "Carte, suivi, service."], ["Au fenua, le bouche-à-oreille…", ["compte énormément", "n'existe pas", "est interdit", "ne concerne que les touristes"], "Tout le monde se connaît."], ["Un client demande un prix sur Messenger. Tu…", ["réponds vite et poliment avec prix et disponibilité", "ne réponds pas", "réponds une semaine après", "demandes de venir sans info"], "Réactivité."], ["Réclamation publique sur Facebook :", ["répondre calmement et proposer un échange privé", "supprimer et bloquer", "se disputer en public", "ignorer"], "On garde son calme."], ["Publier une photo d'un client sans accord est…", ["à ne pas faire", "conseillé", "obligatoire", "sans importance"], "Droit à l'image."]], "c": [{"t": "Le client hésitant", "s": "Un client hésite entre deux ventilateurs à 6 900 F et 9 900 F et dit « je vais réfléchir ».", "o": [["Tu lui demandes ce qui le fait hésiter, compares les deux selon son usage (bruit, puissance, garantie), et respectes sa décision.", 2, "Conseil honnête, porte ouverte."], ["Tu insistes pour le plus cher.", 0, "Client mis sous pression."], ["Tu le laisses partir sans rien dire.", 1, "Pas de pression, mais pas d'aide."], ["Tu baisses le prix sans autorisation.", 0, "Tu n'en as pas le droit."]]}, {"t": "L'avis négatif", "s": "Une cliente écrit sur la page du magasin que le vendeur a été désagréable.", "o": [["Tu réponds poliment, t'excuses, proposes d'en parler en privé et préviens le responsable.", 2, "Image du magasin préservée."], ["Tu réponds qu'elle ment.", 0, "Conflit public."], ["Tu supprimes le commentaire.", 1, "Le problème n'est pas réglé."], ["Tu ne fais rien.", 0, "D'autres clients le lisent."]]}], "o": [["VEN", "Comment découvrez-vous le besoin d'un client ?", ["Questions ouvertes", "Écoute", "Reformulation", "SONCAS", "Observation"]], ["MAG", "Comment fidélisez-vous la clientèle ?", ["Accueil", "Conseil honnête", "Carte de fidélité", "Service après-vente", "Bouche-à-oreille"]]], "e": ["Rédige un dialogue de vente complet entre toi et un client qui cherche un réfrigérateur.", ["Accueil", "Questions", "Argument CAP", "Objection", "Vente additionnelle", "Conclusion"]]}, {"t": "Gérer un rayon et un magasin", "s": "Commandes, inventaire, démarque, vol, prix et étiquetage, sécurité.", "f": [["Commander et gérer le stock", "<ul><li><b>Stock minimum</b> (ou d'alerte) : niveau à partir duquel on recommande.</li><li>Au fenua, tenir compte du <b>délai</b> d'arrivée (bateau, avion) : commander plus tôt et un peu plus.</li><li><b>Rupture</b> : le client ne trouve pas le produit et part ailleurs.</li><li><b>Surstock</b> : de l'argent immobilisé et des produits qui périment.</li><li>Suivre les ventes pour commander juste.</li></ul>"], ["Inventaire et démarque", "<ul><li><b>Inventaire</b> : compter tous les produits, comparer au stock informatique, expliquer les écarts.</li><li><b>Démarque</b> : perte de marchandise. <b>Connue</b> (produits cassés, périmés, déclarés) ou <b>inconnue</b> (vol, erreurs).</li><li>Réduire la démarque : rotation des produits, bon rangement, contrôle des livraisons, vigilance.</li><li>Produits proches de la date : promotion ou don selon la politique du magasin, avant qu'ils ne périment.</li></ul>"], ["Prix, étiquettes et promotions", "<ul><li>Chaque produit doit afficher son <b>prix</b> de façon lisible ; le prix en caisse doit être le même.</li><li>Certains produits de première nécessité ont des prix encadrés au fenua (produits PPN) : on respecte le prix fixé.</li><li><b>Promotion</b> : affiche claire (ancien prix, nouveau prix, dates), stock suffisant.</li><li>Erreur d'étiquette : prévenir le responsable ; on applique la règle du magasin, en général le prix affiché.</li><li>Calcul : prix soldé = prix × (1 − remise).</li></ul>"], ["Vol, sécurité et caisse", "<ul><li>Vol : rester discret, ne jamais fouiller un client soi-même, prévenir le responsable ou l'agent de sécurité.</li><li>Ne jamais se mettre en danger pour de la marchandise.</li><li>Caisse : ne jamais laisser le tiroir ouvert, retirer les gros billets selon la procédure.</li><li>Sécurité : allées dégagées, sols secs (panneau « sol glissant »), escabeau, charges lourdes à deux.</li><li>Évacuation : connaître les sorties de secours et le point de rassemblement.</li></ul>"]], "q": [["Le stock d'alerte est…", ["le niveau à partir duquel on recommande", "le stock maximum", "le stock volé", "le stock de Noël"], "Évite la rupture."], ["Au fenua, il faut commander plus tôt à cause…", ["des délais de bateau et d'avion", "de la chaleur", "des jours fériés seulement", "rien"], "Anticiper."], ["Le surstock entraîne…", ["de l'argent immobilisé et des produits périmés", "plus de ventes forcément", "rien", "une baisse des prix automatique"], "Équilibre à trouver."], ["La démarque inconnue vient surtout…", ["du vol et des erreurs", "des promotions", "de la TVA", "des clients fidèles"], "Elle n'est pas déclarée."], ["Un produit cassé déclaré est de la démarque…", ["connue", "inconnue", "positive", "fiscale"], "On sait pourquoi il manque."], ["Les produits PPN au fenua ont…", ["des prix encadrés à respecter", "des prix libres", "une TVA de 20 %", "aucune étiquette"], "Produits de première nécessité."], ["Une promotion doit afficher…", ["l'ancien prix, le nouveau prix et les dates", "seulement « PROMO »", "rien", "le prix d'achat"], "Information claire."], ["Prix 4 000 F soldé à -25 %. Nouveau prix ?", ["3 000 F", "3 750 F", "2 500 F", "3 250 F"], "4 000 × 0,75."], ["Tu vois un client glisser un produit dans son sac. Tu…", ["préviens discrètement le responsable ou la sécurité", "le fouilles toi-même", "le plaques au sol", "cries au voleur"], "Ne pas se mettre en danger."], ["Un sol mouillé : on…", ["pose un panneau et on essuie", "attend que ça sèche", "ne fait rien", "ferme le magasin"], "Prévenir les chutes."], ["L'inventaire compare…", ["le stock compté au stock informatique", "les prix des concurrents", "les salaires", "les horaires"], "Et explique les écarts."], ["Produits proches de la date limite :", ["promotion ou don selon la politique, avant péremption", "les cacher", "changer la date", "les vendre plus cher"], "Limiter les pertes."]], "c": [{"t": "La rupture du samedi", "s": "Le samedi matin, il ne reste plus de riz en rayon alors que des clients en demandent.", "o": [["Tu vérifies la réserve, réapprovisionnes, informes les clients et signales la rupture pour ajuster la commande.", 2, "Réaction et prévention."], ["Tu dis qu'il n'y en a plus, sans vérifier.", 0, "Ventes perdues."], ["Tu attends lundi.", 0, "Clients partis ailleurs."], ["Tu réapprovisionnes sans prévenir personne.", 1, "Bien, mais la commande ne sera pas corrigée."]]}, {"t": "Le vol aperçu", "s": "Tu vois un adolescent mettre une boîte de chocolat dans sa poche.", "o": [["Tu préviens discrètement ton responsable ou l'agent de sécurité qui gère selon la procédure.", 2, "Sécurité et procédure."], ["Tu le poursuis dehors.", 0, "Danger pour toi."], ["Tu le fouilles.", 0, "Interdit."], ["Tu fais semblant de ne pas voir.", 1, "Pas de danger, mais démarque."]]}], "o": [["RAY", "Comment évitez-vous les ruptures et le surstock ?", ["Stock d'alerte", "Délais du fenua", "Suivi des ventes", "Inventaire", "Communication"]], ["MAG", "Que faites-vous face à un vol ?", ["Rester discret", "Ne pas fouiller", "Prévenir sécurité ou responsable", "Ne pas se mettre en danger", "Signaler"]]], "e": ["Explique en une page comment tu ferais l'inventaire d'un rayon.", ["Préparation", "Comptage", "Comparaison", "Écarts", "Démarque", "Actions"]]}];

e", "<ul><li><b>Inventaire annuel</b> : tout compter à une date, entrepôt arrêté.</li><li><b>Inventaire tournant</b> : on compte une zone différente chaque semaine.</li><li>Compter en binôme, noter clairement, recompter en cas d'écart.</li><li>Expliquer les écarts : erreur de saisie, casse, vol, mauvais rangement.</li><li>Un stock juste évite les ruptures et les achats inutiles.</li></ul>"]], "q": [["Le bon de préparation indique…", ["références, quantités et emplacements", "le salaire", "la météo", "le nom du chauffeur seulement"], "On prépare ligne par ligne."], ["Pourquoi suivre un chemin logique ?", ["pour ne pas revenir sur ses pas et gagner du temps", "pour faire du sport", "aucune raison", "pour éviter les collègues"], "Productivité."], ["Dans un colis, les produits lourds se placent…", ["en bas", "en haut", "au milieu", "dehors"], "Les fragiles protégés."], ["L'adresse A-12-3 désigne…", ["allée, colonne, niveau", "l'âge du produit", "le prix", "le jour de livraison"], "Emplacement précis."], ["La douchette sert à…", ["scanner les codes-barres", "laver le sol", "arroser", "peser"], "Saisie rapide."], ["Étiquette 2/3 sur un colis signifie…", ["deuxième colis sur trois", "deux tiers plein", "à livrer le 2 mars", "fragile"], "Aucun colis oublié."], ["FIFO signifie…", ["premier entré, premier sorti", "premier périmé, premier sorti", "dernier entré, premier sorti", "fin du stock"], "Règle générale."], ["Pour des yaourts, on applique…", ["FEFO", "LIFO", "aucune règle", "le hasard"], "La date limite la plus proche d'abord."], ["L'inventaire tournant consiste à…", ["compter une zone différente régulièrement", "tout compter une fois par an", "tourner les cartons", "ne jamais compter"], "L'entrepôt continue de tourner."], ["En cas d'écart à l'inventaire, on…", ["recompte et cherche la cause", "change le chiffre sans vérifier", "ignore", "accuse un collègue"], "Erreur, casse, vol, rangement."], ["Référence et désignation :", ["la référence est le code, la désignation le function atelier(n,done,back){const A=AT[n],D=dif(),tmax=D===2?60:D===1?120:0;let i=0,pts=0;AUSRC=null;
  const fmtn=v=>String(v).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g," ");

      document.getElementById("nx").onclick=()=>{i++;i<A.it.length?show():done(Math.round(pts/A.it.length*100))}};

      document.getElementById("val").onclick=check;document.getElementById("ans").onkeydown=e=>{if(e.key==="Enter")check()};

        z.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pick.push(pool.find(p=>p[1]===+b.dataset.k));draw()});

ées en 16 ou 20 A. Vérifie toujours la norme en vigueur.</li><li>Couleurs : <b>vert-jaune</b> = terre ; <b>bleu</b> = neutre ; phase en général rouge, marron ou noir.</li><li>Salle de bain : zones de sécurité autour de la douche, appareils adaptés.</li></ul>"], ["Travailler en sécurité et entretenir", "<ul><li><b>Consignation</b> : <b>séparer</b> (couper), <b>condamner</b> (cadenas et étiquette), <b>identifier</b> le circuit, <b>vérifier l'absence de tension</b> (VAT) avec un appareil adapté, puis travailler.</li><li>Jamais travailler sous tension sans habilitation adaptée ; outils isolés, gants, lunettes.</li><li>Électrisation : couper le courant avant de toucher la victime, appeler le <b>15</b>.</li><li><b>Maintenance préventive</b> (planifiée : filtres, tests, contrôles) et <b>corrective</b> (après panne).</li><li>Climatisation : nettoyer les filtres régulièrement, vérifier l'évacuation des condensats ; le fluide frigorigène est manipulé par une personne habilitée.</li><li>Tout noter dans le <b>carnet d'entretien</b>.</li></ul>"]], "q": [["L'intensité se mesure en…", ["ampères", "volts", "watts", "ohms"], "La tension en volts, la puissance en watts."], ["La loi d'Ohm s'écrit…", ["U = R × I", "P = U + I", "R = U × I", "I = U × R"], "Tension = résistance × intensité."], ["Puissance d'un appareil simple ?", ["P = U × I", "P = U ÷ I", "P = R ÷ U", "P = I ÷ U"], "En watts."], ["Chauffe-eau de 2 200 W sous 220 V : intensité ?", ["10 A", "20 A", "2 A", "100 A"], "2 200 ÷ 220."], ["Ce qui est facturé par le fournisseur d'électricité, c'est…", ["l'énergie en kWh", "la tension", "l'intensité", "la résistance"], "E = P × t."], ["Réseau domestique au fenua ?", ["220 V, 60 Hz", "110 V, 50 Hz", "380 V, 50 Hz", "12 V"], "Différent de l'Hexagone (230 V, 50 Hz)."], ["Le différentiel 30 mA protège surtout…", ["les personnes contre les fuites de courant", "les câbles contre la surcharge", "la facture", "l'ampoule"], "Le disjoncteur protège les câbles."], ["Le fil vert-jaune est…", ["la terre", "la phase", "le neutre", "un fil de téléphone"], "Le bleu est le neutre."], ["Première étape de la consignation ?", ["séparer : couper le circuit", "travailler vite", "toucher le fil pour vérifier", "prévenir le client"], "Puis condamner, identifier, vérifier."], ["On vérifie l'absence de tension avec…", ["un appareil de vérification adapté", "le doigt", "un tournevis ordinaire", "la langue"], "VAT."], ["Une personne est électrisée et toujours en contact. Tu…", ["coupes le courant avant de la toucher", "la tires par le bras", "lui jettes de l'eau", "attends"], "Puis 15."], ["Changer un filtre de clim tous les mois, c'est de la maintenance…", ["préventive", "corrective", "inutile", "illégale"], "Planifiée, avant la panne."]], "c": [{"t": "Le disjoncteur qui saute", "s": "Dans une cuisine de snack, le disjoncteur des prises saute dès qu'on branche la friteuse et la bouilloire ensemble.", "o": [["Tu expliques la surcharge, conseilles de ne pas les brancher ensemble et fais vérifier par un électricien habilité la protection et le circuit.", 2, "Cause comprise, intervention par une personne habilitée."], ["Tu remplaces le disjoncteur par un plus gros.", 0, "Danger : le câble risque de chauffer et de prendre feu."], ["Tu conseilles une multiprise.", 0, "Même surcharge, risque d'incendie."], ["Tu dis de réarmer à chaque fois.", 1, "Le problème reste."]]}, {"t": "L'intervention pressée", "s": "Le patron veut que tu changes une prise « tout de suite, sans couper : on a des clients ».", "o": [["Tu refuses de travailler sous tension, coupes et condamnes le bon circuit, vérifies l'absence de tension, puis interviens.", 2, "La sécurité passe avant la pression."], ["Tu travailles sous tension avec des gants de jardin.", 0, "Risque d'électrisation grave."], ["Tu coupes le général sans prévenir.", 1, "Sûr, mais prévenir avant."], ["Tu demandes au client de tenir la lampe.", 0, "Danger."]]}], "o": [["PRE", "Expliquez la consignation électrique.", ["Séparer", "Condamner", "Identifier", "Vérifier l'absence de tension", "Habilitation"]], ["ELE", "Calculez et expliquez l'intensité d'un appareil de 1 100 W sous 220 V.", ["Formule P = U × I", "I = P ÷ U", "5 A", "Choix de la protection", "Unités"]]], "e": ["Rédige la fiche « Avant toute intervention électrique » pour une équipe de maintenance.", ["Habilitation", "Séparer", "Condamner", "Identifier", "Vérifier", "Accident : 15"]]}, {"t": "L'installation électrique d'un logement", "s": "Tableau, circuits, schémas, prises et éclairage, terre, salle d'eau, contrôles.", "f": [["Le tableau électrique", "<ul><li>Le courant arrive par le compteur, puis l'<b>appareil général de coupure</b> (disjoncteur de branchement).</li><li>Le <b>tableau</b> regroupe les <b>différentiels 30 mA</b> (chacun protège une rangée de circuits) et les <b>disjoncteurs divisionnaires</b> (un par circuit).</li><li>Chaque disjoncteur doit être <b>repéré</b> (étiquette : cuisine, chambres, clim…).</li><li>Circuits spécialisés : chauffe-eau, plaque de cuisson, four, lave-linge, climatisation : chacun son disjoncteur.</li><li>Laisser de la place pour des circuits futurs.</li><li>Toujours vérifier la règle d'installation applicable au fenua avant de réaliser une installation.</li></ul>"], ["Lire un schéma", "<ul><li><b>Schéma unifilaire</b> : un seul trait par circuit, avec ses protections ; on y lit l'organisation du tableau.</li><li><b>Schéma développé</b> : tous les fils, pour comprendre et dépanner.</li><li>Symboles : interrupteur, prise de courant, point lumineux, disjoncteur, différentiel, prise de terre.</li><li><b>Simple allumage</b> : un interrupteur commande une lampe.</li><li><b>Va-et-vient</b> : deux interrupteurs commandent la même lampe (couloir, escalier).</li><li><b>Télérupteur</b> : plusieurs boutons-poussoirs pour une lampe (long couloir).</li></ul>"], ["Prises, éclairage et salle d'eau", "<ul><li>Prises à <b>terre</b> obligatoires, à une hauteur suffisante ; nombre limité de prises par circuit.</li><li>Éclairage : points lumineux en 1,5 mm² ; prises en 2,5 mm² (repères usuels).</li><li><b>Salle d'eau</b> : <b>volumes</b> de sécurité autour de la baignoire et de la douche ; dans certains volumes, aucune prise ni interrupteur.</li><li><b>Liaison équipotentielle</b> : relier les éléments métalliques de la salle d'eau à la terre.</li><li>Extérieur : matériel étanche (indice <b>IP</b> adapté), surtout avec la pluie tropicale.</li><li>Ne jamais faire de « dominos » à l'air libre : boîtes de dérivation fermées.</li></ul>"], ["Contrôler et mettre en service", "<ul><li>Vérifier le serrage des connexions et les repères.</li><li>Tester chaque différentiel avec son bouton <b>test</b>.</li><li>Mesurer la <b>résistance de la terre</b> avec un appareil adapté.</li><li>Vérifier que chaque circuit coupe bien au bon disjoncteur.</li><li>Expliquer au client le tableau et les gestes de sécurité.</li><li>Laisser les schémas et la liste des circuits dans le tableau.</li></ul>"]], "q": [["Le différentiel 30 mA protège…", ["les personnes contre les fuites de courant", "les câbles contre la surchauffe", "le compteur", "la facture"], "Le disjoncteur protège le circuit."], ["Chaque disjoncteur du tableau doit être…", ["repéré par une étiquette", "peint en rouge", "caché", "doublé"], "On sait quel circuit couper."], ["Un chauffe-eau doit avoir…", ["son propre circuit et son disjoncteur", "une multiprise", "le circuit des lampes", "aucune protection"], "Circuit spécialisé."], ["Le schéma unifilaire représente…", ["un trait par circuit avec ses protections", "tous les fils", "le plan de la maison", "la facture"], "Organisation du tableau."], ["Le va-et-vient permet…", ["de commander une lampe depuis deux endroits", "de couper le courant général", "de doubler la puissance", "de charger un téléphone"], "Couloir, escalier."], ["Le télérupteur s'utilise…", ["avec plusieurs boutons-poussoirs pour une lampe", "pour une prise", "pour la clim seulement", "jamais"], "Long couloir."], ["Section usuelle pour les prises ?", ["2,5 mm²", "0,5 mm²", "10 mm²", "1 mm²"], "Éclairage : 1,5 mm²."], ["Dans la salle de bain, on respecte…", ["des volumes de sécurité", "aucune règle", "la couleur des murs", "la taille du miroir"], "Certains volumes sans prise ni interrupteur."], ["La liaison équipotentielle relie…", ["les éléments métalliques à la terre", "deux lampes", "le compteur au voisin", "deux prises"], "Salle d'eau."], ["Dehors, sous la pluie, le matériel doit avoir…", ["un indice IP adapté", "une couleur claire", "un prix bas", "rien de spécial"], "Étanchéité."], ["Les connexions se font…", ["dans des boîtes de dérivation fermées", "à l'air libre", "avec du scotch seul", "derrière un rideau"], "Sécurité incendie."], ["Avant de mettre en service, on teste…", ["chaque différentiel avec son bouton test", "seulement l'ampoule", "rien", "la sonnette"], "Et la résistance de terre."]], "c": [{"t": "Le tableau sans étiquettes", "s": "Un client te demande de changer une prise de cuisine, mais aucun disjoncteur n'est repéré.", "o": [["Tu identifies le circuit en coupant et en vérifiant l'absence de tension, puis tu étiquettes le tableau pour la suite.", 2, "Sécurité et travail utile pour le client."], ["Tu travailles sans couper.", 0, "Danger grave."], ["Tu coupes le général sans prévenir les occupants.", 1, "Sûr, mais préviens d'abord."], ["Tu devines le disjoncteur.", 0, "Il faut toujours vérifier."]]}, {"t": "La prise dans la douche", "s": "Un client veut une prise juste à côté de la douche pour son rasoir.", "o": [["Tu expliques les volumes de sécurité et proposes un emplacement autorisé ou une prise rasoir adaptée.", 2, "Conseil et sécurité."], ["Tu la poses où il veut.", 0, "Risque d'électrocution."], ["Tu refuses sans expliquer.", 1, "Sûr, mais client mal informé."], ["Tu mets une rallonge.", 0, "Encore plus dangereux."]]}], "o": [["ELE", "Décrivez l'organisation d'un tableau électrique.", ["Appareil général", "Différentiels 30 mA", "Disjoncteurs divisionnaires", "Circuits s
